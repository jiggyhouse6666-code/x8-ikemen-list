<style>
:root{
  --bg:#131019;
  --bg-elev:#1b1725;
  --surface:#221d30;
  --surface2:#2b2440;
  --border:#3a3350;
  --gold:#d4af37;
  --gold-dim:#8a7233;
  --gold-soft:rgba(212,175,55,0.15);
  --gold-grad:linear-gradient(135deg, #f6e2a8 0%, #d4af37 45%, #9c7a2e 100%);
  --indigo:#7d8cff;
  --danger:#e5535a;
  --danger-soft:rgba(229,83,90,0.15);
  --success:#38caa0;
  --success-soft:rgba(56,202,160,0.15);
  --text:#f3f0ea;
  --text-dim:#a79fc0;
  --text-faint:#6d6585;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 130% 45% at 50% 0%, rgba(212,175,55,0.16), transparent 62%),
    var(--bg);
  color:var(--text);
  font-family:'Noto Sans JP', sans-serif;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; }
button{cursor:pointer;}
#app{display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; position:relative;}

/* ===== header ===== */
header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, var(--bg-elev), var(--bg));
  gap:8px; min-height:48px; position:relative;
}
header::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:var(--gold-grad); opacity:0.55;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand .mark{
  font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1px;
  font-size:18px; color:#241a05; background:var(--gold-grad); border-radius:7px;
  padding:3px 8px 3px 9px; text-align:center; line-height:1.3; flex:0 0 auto;
  box-shadow:0 2px 10px rgba(212,175,55,0.4);
}
.brand .titles{min-width:0;}
.brand .sub{
  font-family:'Great Vibes', cursive; font-weight:400;
  font-size:27px; line-height:1.15; letter-spacing:0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:var(--gold-grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,0.35));
}
.brand .page-title{font-size:11.5px; color:var(--text-faint); font-weight:600; letter-spacing:0.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.live-dot{
  display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--success);
  margin-right:5px; box-shadow:0 0 6px rgba(56,202,160,0.85); vertical-align:middle;
  animation:liveDotPulse 1.8s ease-in-out infinite;
}
@keyframes liveDotPulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
.live-dot.offline{background:var(--danger); box-shadow:0 0 6px rgba(229,83,90,0.85); animation:none;}
.header-title-center{font-size:14.5px; color:var(--text); font-weight:800; text-align:center; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.header-spacer{width:38px; flex:0 0 auto;}

/* ===== main ===== */
main{flex:1 1 auto; overflow-y:auto; padding:16px 14px calc(28px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch;}
.section-title{font-size:12.5px; color:var(--gold); letter-spacing:1px; font-weight:700; margin:20px 0 8px;}
.section-title:first-child{margin-top:0;}
.hint{font-size:12.5px; color:var(--text-faint); margin:0 0 14px; text-align:center;}
.btn{
  background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:11px;
  padding:12px 14px; font-size:14px; font-family:inherit; font-weight:700;
}
.btn:active{transform:scale(0.97);}
.btn.gold{background:var(--gold-grad); color:#221a05; border-color:transparent; box-shadow:0 4px 14px rgba(212,175,55,0.35);}
.btn.ghost{background:none; border:1px solid var(--border); color:var(--text-dim); font-weight:500;}
.btn.ghost.danger{border-color:var(--danger-soft); color:var(--danger); background:var(--danger-soft);}
.btn.block{width:100%;}
.btn.icon-only{padding:9px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:18px;}
.btn:disabled{opacity:0.4;}
input:focus, textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
.empty-hint{color:var(--text-faint); font-size:12.5px; text-align:center; padding:26px 10px; border:1px dashed var(--border); border-radius:var(--radius);}
.visually-hidden-file{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
::-webkit-scrollbar{width:0; height:0;}

/* ===== gallery (本棚) ===== */
.book-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.book-grid-span{grid-column:1/-1;}
.book-card{
  position:relative; aspect-ratio:3/4; border-radius:var(--radius); overflow:hidden;
  border:1px solid var(--border); background:var(--surface); padding:0; display:block; width:100%;
  box-shadow:0 8px 20px rgba(0,0,0,0.45);
}
.book-card::before{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:2;
  box-shadow:inset 0 0 0 1px rgba(230,195,120,0.35);
}
.book-card:active{transform:scale(0.97);}
.book-photo{width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none;}
.book-photo.contain{object-fit:contain; background:var(--surface);}
.book-photo.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(10,8,14,0.55);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:34px;
}
.book-live-dot{
  position:absolute; top:7px; right:7px; z-index:3; width:8px; height:8px; border-radius:50%;
  background:var(--success); box-shadow:0 0 8px rgba(56,202,160,0.9), 0 0 0 2px rgba(10,8,14,0.55);
  animation:liveDotPulse 1.8s ease-in-out infinite;
}
.book-card.drag-mode{touch-action:none;}
.book-card.dragging{z-index:50; box-shadow:0 10px 26px rgba(0,0,0,0.55); cursor:grabbing;}

/* ===== detail ===== */
.detail-hero{display:flex; justify-content:center; margin:6px 0 16px;}
.detail-photo{
  width:220px; height:280px; object-fit:cover; border-radius:var(--radius);
  border:1px solid rgba(230,195,120,0.4); display:block;
  box-shadow:0 14px 34px rgba(0,0,0,0.5), 0 0 0 1px rgba(230,195,120,0.15);
}
.detail-photo.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(10,8,14,0.55);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:72px;
}
.detail-name{text-align:center; font-size:19px; font-weight:800; color:var(--text); margin-bottom:4px;}
.detail-sub{text-align:center; font-size:12px; color:var(--text-faint); margin-bottom:16px;}

/* ===== full-screen photo viewer (tap a card, before the edit picker opens) ===== */
main.full-bleed{padding:0; overflow:hidden;}
.viewer{position:relative; width:100%; height:100%; background:#0a080e; touch-action:pan-y;}
.viewer-photo{width:100%; height:100%; object-fit:cover; display:block; animation:viewerFade .18s ease; -webkit-user-drag:none; user-select:none;}
.viewer-photo.contain{object-fit:contain; background:#0a080e;}
.viewer-photo.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.3);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:120px;
}
@keyframes viewerFade{ from{opacity:0;} to{opacity:1;} }
.viewer-foot{
  position:absolute; left:0; right:0; bottom:0; padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg, rgba(0,0,0,0.78), rgba(0,0,0,0));
  display:flex; align-items:flex-end; justify-content:flex-end; gap:10px;
}
.viewer-count{
  color:#fff; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;
  border:1px solid rgba(230,195,120,0.6); border-radius:20px; padding:4px 11px; background:rgba(10,8,14,0.45);
  margin-bottom:3px;
}
.viewer-edit-btn{
  position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:2;
  width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.3);
  background:rgba(10,8,14,0.55); color:#fff; font-size:16px; padding:0;
  display:flex; align-items:center; justify-content:center;
}
.viewer-edit-btn:active{transform:scale(0.92);}

.picker{margin-top:22px; padding-top:18px; border-top:1px solid var(--border);}
.promo-row{display:flex; gap:10px; flex-wrap:wrap;}
.promo-tile{
  position:relative; width:92px; height:92px; border-radius:12px; overflow:hidden;
  border:2px solid var(--border); background:var(--surface2); padding:0; display:block;
}
.promo-tile.active{border-color:var(--gold);}
.promo-tile img{width:100%; height:100%; object-fit:cover; display:block;}
.promo-tile.upload-tile{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  border-style:dashed; color:var(--text-dim);
}
.upload-plus{font-size:22px; color:var(--gold); line-height:1;}
.upload-label{font-size:10px; text-align:center; padding:0 4px;}
.check{
  position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
  background:var(--gold-grad); color:#221a05; font-size:12px; font-weight:900;
  display:flex; align-items:center; justify-content:center; box-shadow:0 1px 6px rgba(212,175,55,0.5);
}
/* A stock tile's delete ✕ has to sit alongside its .promo-tile, not inside
   it (two buttons can't nest), so this wrapper just gives it something
   relatively-positioned to pin itself to the corner of. */
.stock-tile{position:relative; width:92px; height:92px;}
.stock-delete{
  position:absolute; bottom:-6px; right:-6px; z-index:1; width:22px; height:22px; border-radius:50%;
  background:rgba(10,8,14,0.88); color:#fff; border:1px solid rgba(255,255,255,0.3); padding:0;
  font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center;
}
.stock-delete:active{transform:scale(0.9);}

/* ===== reorder (並び替え) ===== */
.reorder-list{display:flex; flex-direction:column; gap:8px;}
.reorder-row{
  display:flex; align-items:center; gap:10px; padding:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:12px;
}
.reorder-row.excluded{opacity:0.6;}
.reorder-rank{
  width:32px; height:32px; flex:0 0 auto; border-radius:8px; text-align:center;
  background:var(--surface2); border:1px solid var(--border); color:var(--gold);
  font-family:inherit; font-weight:800; font-size:13px; font-variant-numeric:tabular-nums;
}
.reorder-main{
  display:flex; align-items:center; gap:10px; flex:1 1 auto; min-width:0;
  background:none; border:none; padding:0; margin:0; text-align:left; font:inherit; color:inherit; cursor:pointer;
}
.reorder-thumb{width:44px; height:44px; border-radius:10px; object-fit:cover; flex:0 0 auto; border:1px solid var(--border);}
.reorder-thumb.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(10,8,14,0.55);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:17px;
}
.reorder-text{flex:1 1 auto; min-width:0;}
.reorder-name{font-size:14px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.reorder-sub{font-size:10.5px; color:var(--text-faint); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.reorder-sub.rank-mismatch{color:var(--danger);}
.reorder-btns{display:flex; flex-direction:column; gap:6px; flex:0 0 auto;}
.reorder-btns-row{display:flex; gap:6px;}
.reorder-btns .btn{width:34px; height:34px; padding:0; font-size:13px;}
.reorder-btns .btn:disabled{opacity:0.25;}
.ops-toggle{
  width:74px; height:24px; padding:0; font-size:10.5px; font-weight:700; letter-spacing:0.2px;
  border-radius:7px; white-space:nowrap; overflow:hidden;
}
.ops-toggle.active{font-size:9.5px; background:var(--gold-grad); color:#241a05; border-color:transparent;}

/* ===== rank import (ナンバー登録) ===== */
.rank-import-intro{font-size:12.5px; color:var(--text-faint); text-align:left; line-height:1.6; margin:0 0 12px;}
.rank-textarea{
  width:100%; min-height:300px; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; color:var(--text); font-size:14px; font-family:inherit; line-height:1.7;
  padding:12px; resize:vertical; box-sizing:border-box;
}

/* ===== modal ===== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,8,14,0.72); z-index:150;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.modal-box{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; width:100%; max-width:320px;
}
.modal-message{font-size:14.5px; color:var(--text); margin-bottom:14px; line-height:1.5; text-align:center;}
.modal-input{
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:10px 12px; font-size:16px; font-family:inherit; width:100%; text-align:center; letter-spacing:4px;
  margin-bottom:8px;
}
.modal-error{color:var(--danger); font-size:12.5px; text-align:center; margin-bottom:8px;}
.modal-actions{display:flex; gap:8px; margin-top:6px;}
.modal-actions .btn{flex:1;}

/* ===== toast ===== */
#toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px);
  background:var(--danger); color:#fff; padding:10px 16px; border-radius:20px; font-size:13px; font-weight:600;
  z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:80%; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <header id="headerInner"></header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<input type="file" accept="image/*" id="promoPhotoFileInput" class="visually-hidden-file">
<input type="file" accept="image/*" id="staffStockFileInput" class="visually-hidden-file">

<script type="module">
'use strict';
/* =========================================================================
   X8 イケメンリスト（内部名: otokohon）— 宣材写真ストックから切り替えて
   見せるスタッフ名鑑
   データ層: Firebase Realtime Database — X8 TIME CHECKと同じプロジェクト
   （x8clean）の timecheck/ を共有する（名簿は config/staff、宣材写真は
   staffPhotos/ をTIME CHECKの設定タブとそのまま共有。出勤時の顔写真は
   attendance/ + photos/ を読み取り専用で参照する — 新規の選択UIはもう
   無いが、既存データとの後方互換のため解決ロジックだけ残っている）。
   このアプリ独自のデータは、宣材写真のストック staffPhotoStock/ と、
   「どの写真を表示するか」のポインタ otokohonSelection/ の2つ。
   ホスティング: GitHub Pages（誰でもアクセス可、Claudeのサインイン不要）。
   ========================================================================= */

  getDatabase,
  ref as fbRef,
  get as fbGet,
  set as fbSet,
  update as fbUpdate,

// browsing/selection UI over that same staff/photo data, not a separate
// data domain (unlike X8 OPEN CHECK, which keeps its own key).
const DB_PREFIX = 'timecheck';
function fullPath(path){ return DB_PREFIX + '/' + path; }

// Same shared deterrent code as the rest of the X8 suite — not real
// security, just a casual-staff speed bump before changing a photo.
const MANAGEMENT_PASSWORD = '6666';

let db = null;

/* ---------- thin db adapter (ported as-is from X8 TIME CHECK) ---------- */
function wrapSnap(fbSnap, id){
  const exists = fbSnap.exists();
  return { id, exists, data: () => exists ? fbSnap.val() : undefined };
}
function makeDocRef(path){
  const segs = path.split('/');
  const id = segs[segs.length-1];
  return {
    id,
    async get(){ const snap = await fbGet(fbRef(rtdb, fullPath(path))); return wrapSnap(snap, id); },
    async set(data){ await fbSet(fbRef(rtdb, fullPath(path)), data); },
    async update(patch){
      const flat = {};
      (function flatten(prefix, obj){
        for(const k in obj){
          const v = obj[k];
          const key = prefix ? prefix + '/' + k : k;
          if(v && typeof v==='object' && !Array.isArray(v)) flatten(key, v);
          else flat[key] = v;
        }
      })('', patch);
      await fbUpdate(fbRef(rtdb, fullPath(path)), flat);
    },
    onSnapshot(next, errCb){
      const r = fbRef(rtdb, fullPath(path));
      return fbOnValue(
        r,
        (snap)=>{ try{ next(wrapSnap(snap, id)); }catch(e){} },
        (err)=>{ if(errCb) errCb({ code:'unavailable', message: err && err.message }); }
      );
    }
  };
}

/* ---------- helpers (ported as-is from X8 TIME CHECK) ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function monthKeyOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1); }
function dayKeyOf(d){ return pad2(d.getDate()); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const STAFF_COLORS = ['#cda449','#7d8cff','#38caa0','#e5535a','#c98bd8','#5fb0d9','#e6a15c','#7ad1c9'];
function colorFor(id){ let h=0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0; return STAFF_COLORS[h % STAFF_COLORS.length]; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{ t.classList.remove('show'); }, 2600);
}
function loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (err)=>{ URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}
function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
// Same quality ladder as X8 TIME CHECK's own 宣材写真 upload — this app
// writes to the exact same staffPhotos/{id} node, so it should produce the
// exact same kind of file.
const STAFF_PHOTO_ATTEMPTS = [
  { w: 640, q: 0.78 },
  { w: 560, q: 0.72 },
  { w: 480, q: 0.68 },
  { w: 400, q: 0.6 },
  { w: 320, q: 0.55 },
  { w: 240, q: 0.5 },
];
const STAFF_PHOTO_MAX_CHARS = 350000;
async function makeCompressedDataUrl(fileOrBlob, attempts, capChars){
  let img;
  try{ img = await loadImageFromFile(fileOrBlob); }catch(e){ return null; }
  for(const a of attempts){
    const h = Math.max(1, Math.round(a.w * img.height / img.width));
    const canvas = document.createElement('canvas');
    canvas.width = a.w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, a.w, h);
    const smallBlob = await new Promise(res=>canvas.toBlob(res,'image/jpeg',a.q));
    if(!smallBlob) continue;
    const dataUrl = await blobToDataUrl(smallBlob);
    if(dataUrl.length < capChars) return dataUrl;
  }
  return null;
}

// otokohon-20: 電波が悪い/画面ロック中にWebSocketが死んでいたのを、Firebase側が
// 自分で気づくまで放置すると「反映が悪い」と感じるほど長くかかることがある
// （SDKの死活検知は保守的）。.info/connected を自前で見て可視化しつつ、
// タブが再度見える/オンラインに戻った瞬間に goOffline→goOnline を強制して
// 即座に再接続させる（=全onValueリスナーがすぐ最新状態で再発火する）。
let rtdbConnected = true;

/* ---------- firebase subscriptions ---------- */
async function init(){
  try{
    const fbApp = initializeApp(FIREBASE_CONFIG);
    rtdb = getDatabase(fbApp);
    db = { doc: makeDocRef };
  }catch(e){ db = null; rtdb = null; }
  subscribeStaff();
  subscribeStaffPhotos();
  subscribeStaffPhotoStock();
  subscribeSelection();
  subscribeStaffOrder();
  subscribeExcludedStaff();
  subscribeGalleryHidden();
  subscribeNameRankTable();
  subscribeRankApplied();
  subscribeConnectionState();
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') forceReconnect(); });
  window.addEventListener('online', forceReconnect);
  window.addEventListener('pageshow', forceReconnect);
  renderApp();
  document.getElementById('app').addEventListener('click', onAppClick);
  document.getElementById('app').addEventListener('change', onAppChange);
  document.getElementById('app').addEventListener('keydown', onAppKeydown);
  document.getElementById('app').addEventListener('focusin', onAppFocusIn);
  document.getElementById('app').addEventListener('input', onAppInput);
  document.getElementById('main').addEventListener('pointerdown', onMainPointerDown);
  document.getElementById('main').addEventListener('pointermove', onMainPointerMove);
  document.getElementById('main').addEventListener('pointerup', onMainPointerUp);
  document.getElementById('main').addEventListener('pointercancel', onMainPointerUp);
  // A phone's native "hold to show menu / save image" callout would otherwise
  // fight with our own long-press-to-reorder gesture on a gallery photo.
  document.getElementById('main').addEventListener('contextmenu', (e)=>{ if(e.target.closest('.book-card')) e.preventDefault(); });
  document.getElementById('toast').addEventListener('click', ()=>{ document.getElementById('toast').classList.remove('show'); });
  document.getElementById('promoPhotoFileInput').addEventListener('change', onPromoPhotoFileSelected);
  document.getElementById('staffStockFileInput').addEventListener('change', onStaffStockFileSelected);
  // Catches a page left open across midnight: without this, the attendance
  // listeners below would keep watching yesterday's (now frozen) doc forever.
  setInterval(refreshTodayKeysAndResubscribe, 60000);
}

// .info/connected is a special Firebase-SDK path that always lives at the
// database root (not under our DB_PREFIX namespace) — it reflects this
// client's own current socket state, not any app data.
function subscribeConnectionState(){
  if(!rtdb){ return; }
  fbOnValue(fbRef(rtdb, '.info/connected'), (snap)=>{
    rtdbConnected = snap.val() === true;
    renderApp();
  });
}
function forceReconnect(){
  if(!rtdb) return;
  try{ fbGoOffline(rtdb); }catch(e){}
  try{ fbGoOnline(rtdb); }catch(e){}
}

function subscribeStaff(){
  if(!db){ renderApp(); return; }
  db.doc('config/staff').onSnapshot(
    (snap)=>{
      const data = snap.exists ? snap.data() : null;
      staffList = (data && Array.isArray(data.list)) ? data.list : [];
      syncAttendanceSubscriptions();
      refreshResolvedGalleryPhotos();
      // config/staff, staffPhotos, otokohonNameRank and otokohonRankApplied
      // are four independent Firebase listeners with no guaranteed arrival
      // order — applyRankToNewlyEligibleStaff() needs all four loaded
      // (it keys staffPhotos entries by staff id via staffList) and is
      // already re-run whenever the other three change, but without this
      // call, a load where this one happens to arrive LAST would leave
      // staffList empty on every one of those earlier runs, silently
      // skipping everyone (byId[id] fails for all of them) with nothing to
      // ever retry — exactly the "新しく写真が増えた人が売上順の位置に来な
      // い" symptom, intermittently, depending on network timing alone.
      applyRankToNewlyEligibleStaff();
      renderApp();
    },
    ()=>{ renderApp(); }
  );
}

// ---------- live attendance status (gates gallery visibility) ----------
// A day-key alone isn't enough, even with businessDayOf's 25時 cutover: a
// host clocked in at 23:50 has that 出勤 filed under YESTERDAY's (calendar)
// day bucket, and a long shift can still have no 退勤 well after this app's
// own "today" has rolled over at 1am — so "currently in" looks at today's
// AND yesterday's events together and asks which is the most recent live
// one, not just scans today's bucket alone. This is the same
// hasInToday/hasOutToday idea X8 TIME CHECK's own clock screen uses to
// decide whether to show 出勤 or 退勤 next, just widened to two buckets.
function computeInStatus(dayDocs){
  let latest = null;
  dayDocs.forEach(dayDoc=>{
    const events = (dayDoc && Array.isArray(dayDoc.events)) ? dayDoc.events : [];
    events.forEach(e=>{
      if(e.deleted) return;
      if(!latest || (e.ts||0) > (latest.ts||0)) latest = e;
    });
  });
  return !!latest && latest.type==='in';
}
// A host club's night doesn't end at 24:00 — 25時 (1am) is the
// conventional cutover, matching how the venue itself talks about "today"
// deep into a shift: between 0:00 and 0:59 it's still last night. Until 1am
// local time, this returns yesterday's date; from 1am on, it returns today.
function businessDayOf(d){
  const b = new Date(d);
  if(b.getHours() < 1) b.setDate(b.getDate() - 1);
  return b;
}
// Kept one business day behind todayMonthKey/todayDayKey — recomputed
// whenever those roll over. Tracked as its own month+day pair (not just
// "today's day number minus one") since the two can land in different
// months (the 1st of the month, 一日's yesterday is last month).
function recomputeYesterdayKeys(){
  const y = businessDayOf(new Date());
  y.setDate(y.getDate() - 1);
  yesterdayMonthKey = monthKeyOf(y);
  yesterdayDayKey = dayKeyOf(y);
}
function subscribeAttendanceFor(staffId){
  if(!db || attendanceUnsubs[staffId]) return;
  // Also always subscribe to the LITERAL calendar month (see
  // recomputeAttendanceStatus for why) — almost always the same month as
  // todayMonthKey, except for the ~1 hour a year both "it's after midnight
  // but before this app's own 1am business-day rollover" AND "that midnight
  // was also the 1st of the month" are true at once.
  const monthKeys = Array.from(new Set([todayMonthKey, yesterdayMonthKey, monthKeyOf(new Date())]));
  attendanceRawByMonth[staffId] = {};
  const unsubs = monthKeys.map(monthKey=>{
    const path = 'attendance/' + staffId + '_' + monthKey;
    return db.doc(path).onSnapshot(
      (snap)=>{
        attendanceRawByMonth[staffId][monthKey] = snap.exists ? snap.data() : null;
        recomputeAttendanceStatus(staffId);
      },
      ()=>{}
    );
  });
  attendanceUnsubs[staffId] = ()=>{ unsubs.forEach(u=>{ try{ u(); }catch(e){} }); };
}
// X8 TIME CHECK itself (the app that actually writes these events) files
// every clock-in/out under the LITERAL calendar day it's tapped on — it has
// no 25時/1am cutover of its own, unlike this app's businessDayOf. The two
// only disagree during one window: 0:00-0:59, after real midnight but before
// this app's OWN "today" has rolled over. A tap made in exactly that window
// lands in the literal-today bucket, which — without this third lookup —
// neither todayDayKey ("still last business day") nor yesterdayDayKey
// ("the day before that") would ever check, leaving it invisible to
// computeInStatus for up to an hour: a 退勤 tapped at 0:10 wouldn't clear
// someone's still-shown "出勤中" until 1am, and symmetrically a fresh 0:10
// 出勤 wouldn't appear either. (Confirmed directly against X8 TIME CHECK's
// own write path — monthKeyOf(now)/dayKeyOf(now), no adjustment — not
// assumed.) Outside that one hour a night this is just the same doc as
// todayDoc, so merging it into computeInStatus's "latest wins" scan below
// is always safe, never just an extra case to worry about.
function recomputeAttendanceStatus(staffId){
  const raw = attendanceRawByMonth[staffId] || {};
  const todayDoc = raw[todayMonthKey] && raw[todayMonthKey].days && raw[todayMonthKey].days[todayDayKey];
  const yesterdayDoc = raw[yesterdayMonthKey] && raw[yesterdayMonthKey].days && raw[yesterdayMonthKey].days[yesterdayDayKey];
  const literalMonthKey = monthKeyOf(new Date()), literalDayKey = dayKeyOf(new Date());
  const literalTodayDoc = raw[literalMonthKey] && raw[literalMonthKey].days && raw[literalMonthKey].days[literalDayKey];
  attendanceStatus[staffId] = computeInStatus([yesterdayDoc, todayDoc, literalTodayDoc]);
  renderApp();
}
function unsubscribeAttendanceFor(staffId){
  const un = attendanceUnsubs[staffId];
  if(un){ try{ un(); }catch(e){} delete attendanceUnsubs[staffId]; }
  delete attendanceStatus[staffId];
  delete attendanceRawByMonth[staffId];
}
// One live listener per CURRENT staff member: adds any newly-registered
// staff, drops anyone removed, so nothing leaks as the roster changes.
function syncAttendanceSubscriptions(){
  const ids = {};
  staffList.forEach(s=>{ ids[s.id] = true; });
  staffList.forEach(s=>subscribeAttendanceFor(s.id));
  Object.keys(attendanceUnsubs).forEach(id=>{ if(!ids[id]) unsubscribeAttendanceFor(id); });
}
// Re-points every attendance listener at today's (and yesterday's) doc once
// the BUSINESS day actually rolls over (see businessDayOf — 25時/1am, not
// 24:00), instead of silently listening to a now-frozen old day forever.
// Also catches the literal calendar month changing (real midnight) even
// while the business day hasn't rolled over yet — the ~once-a-month case
// where that midnight is also the 1st, so subscribeAttendanceFor's own
// literal-month subscription (set up back when this staffId was first
// subscribed, potentially last month) needs rebuilding too; see
// recomputeAttendanceStatus for why the literal day matters at all.
function refreshTodayKeysAndResubscribe(){
  const bd = businessDayOf(new Date());
  const mk = monthKeyOf(bd), dk = dayKeyOf(bd);
  const literalMk = monthKeyOf(new Date());
  if(mk===todayMonthKey && dk===todayDayKey && literalMk===trackedLiteralMonthKey) return;
  todayMonthKey = mk; todayDayKey = dk;
  trackedLiteralMonthKey = literalMk;
  recomputeYesterdayKeys();
  Object.keys(attendanceUnsubs).forEach(unsubscribeAttendanceFor);
  attendanceStatus = {};
  syncAttendanceSubscriptions();
  renderApp();
}

// The display order this app shows (gallery grid + reorder screen): the
// saved order, limited to staff who still exist, with any staff NOT yet in
// it (brand new, or before anyone has ever reordered) appended at the end
// in their natural config/staff order. Never mutates config/staff itself.
function orderedStaffList(){
  const byId = {};
  staffList.forEach(s=>{ byId[s.id] = s; });
  const saved = Array.isArray(staffOrder) ? staffOrder.filter(id=>byId[id]) : [];
  const missing = staffList.map(s=>s.id).filter(id=>!saved.includes(id));
  return saved.concat(missing).map(id=>byId[id]);
}

// The gallery itself only shows staff who are CURRENTLY clocked in — this
// board is for customers to see who's working right now, not a full staff
// list. 運営 (excludedStaff) never appear here even while clocked in with a
// photo, and neither does anyone manually hidden for having no photo yet
// (galleryHidden). The reorder screen still uses orderedStaffList()
// (everyone, both kinds of hidden staff included), since relative order —
// and the 運営/非表示 toggles themselves — need to be set up for staff
// before their first shift too.
function visibleGalleryStaffList(){
  return orderedStaffList().filter(s=>attendanceStatus[s.id] && !excludedStaff[s.id] && !galleryHidden[s.id]);
}

async function resolveInlinePhoto(photoRef){
  if(!photoRef || !photoRef.startsWith('inline:')) return null;
  const id = photoRef.slice(7);
  if(id in inlinePhotoCache) return inlinePhotoCache[id];
  try{
    const snap = await db.doc('photos/' + id).get();
    const url = (snap.exists && snap.data().dataUrl) || null;
    inlinePhotoCache[id] = url;
    return url;
  }catch(e){ return null; }
}

// True when this staff member's 宣材写真 (the single-slot staffPhotos/
// upload) is what should be shown, as opposed to a 宣材写真ストック pick
// or a legacy clock-in capture. A stock pick (kind:'stock') is always an
// explicit, deliberate choice with no auto-expiry, so it's simply never
// "active" while selected — same for a clock-in pin, except that one DOES
// expire automatically once a newer 宣材写真 has since been set (or
// replaced), i.e. a newer promotional photo always wins, on live devices
// and on a cold load alike ("宣材写真は追加すれば選べる様にしたい"; a
// clock-in ("顔") selection is explicitly not worth keeping fresh the
// other way) — purely a timestamp comparison against data already stored
// (staffPhotos' own ts vs the selection's own ts), so there's no extra
// "have I seen this before" state to get wrong, same idea as why
// otokohonRankApplied is a persisted fact rather than a per-tab memory.
// Shared by the resolved-photo logic and the picker's own "✓" highlight
// so the two always agree on what's actually being shown.
function isPromoPhotoActive(staffId){
  const sel = selection[staffId];
  if(!sel || sel.kind==='staffPhoto') return true;
  if(sel.kind==='clockin') return (sel.ts||0) < (staffPhotosTs[staffId]||0);
  if(sel.kind==='stock') return false;
  return true;
}

// Resolves each staff member's CURRENTLY DISPLAYED photo: their selection
// pointer if one has been set (a 宣材写真ストック pick, the 宣材写真 slot
// itself, or a legacy clock-in capture), otherwise falls back to the
// 宣材写真 slot directly — so a club that's never touched 男本 yet still
// shows whatever's already uploaded in X8 TIME CHECK's settings, with
// zero setup required. A stock pick whose image has since been deleted
// (or whose staffPhotoStock doc is gone entirely) falls safely through to
// the 宣材写真 slot, same safe-fallback principle as the clock-in branch
// below — resolving to the plain 宣材写真 is always safe and never a dead
// end, by construction.
//
// staffPhotos/, staffPhotoStock/ and otokohonSelection/ are three separate
// onSnapshot listeners, each calling this function on its own whenever any
// one changes. Deleting a photo now writes to all three at once (see
// doRemoveStaffPhoto), so their listener callbacks can fire back to back,
// and two overlapping calls here can finish in the opposite order from how
// they started — an older call (built from since-superseded
// selection/staffPhotos/staffPhotoStock) finishing after a newer one would
// silently overwrite the correct, fresher result with a stale one, and
// nothing after that ever asks for another refresh to undo it. A
// generation counter keeps only the result of whichever call started last.
let resolvedGalleryPhotosGen = 0;
async function refreshResolvedGalleryPhotos(){
  const gen = ++resolvedGalleryPhotosGen;
  const ids = staffList.map(s=>s.id);
  const next = {};
  await Promise.all(ids.map(async id=>{
    const sel = selection[id];
    if(sel && sel.kind==='stock'){
      const stockImg = staffPhotoStock[id] && staffPhotoStock[id].images && staffPhotoStock[id].images[sel.imgId];
      next[id] = (stockImg && stockImg.dataUrl) || staffPhotos[id] || null;
    } else if(sel && sel.kind==='clockin' && sel.photo && !isPromoPhotoActive(id)){
      next[id] = await resolveInlinePhoto(sel.photo);
    } else {
      next[id] = staffPhotos[id] || null;
    }
  }));
  if(gen !== resolvedGalleryPhotosGen) return; // a newer refresh has since started; this result is stale, discard it
  resolvedGalleryPhotos = next;
  renderApp();
  clearGalleryHiddenWherePhotoAppeared(next);
}

// A staff member hidden via galleryHidden was hidden ONLY because they had
// no photo at the time. The moment a photo shows up for them (宣材写真
// registered, or a clock-in photo resolved above), that reason is gone, so
// clear the flag automatically rather than leaving them stuck hidden until
// someone remembers to go flip it back. Never touches excludedStaff/運営 —
// that one is a deliberate, permanent admin choice unrelated to photos.
async function clearGalleryHiddenWherePhotoAppeared(resolved){
  const toClear = Object.keys(galleryHidden).filter(id=>resolved[id]);
  if(!toClear.length || !db) return;
  const next = Object.assign({}, galleryHidden);
  toClear.forEach(id=>{ delete next[id]; });
  galleryHidden = next;
  renderApp();
  try{ await db.doc('otokohonGalleryHidden').set(next); }
  catch(e){ /* best-effort — worst case it's still hidden and the next refresh tries again */ }
}


/* ---------- actions ---------- */
// A "detail" item is either a real staff member or one of the fixed
// LEAD_SLIDES (QR code / menu pages) — looked up by id through this one
// function everywhere the app needs to go from an id to "what is this",
// so a lead slide's id (never a real Firebase-generated staff id, by
// construction — see LEAD_SLIDES) is recognized before falling through to
// the staff roster.
function findDetailItem(id){
  const lead = LEAD_SLIDES.find(l=>l.id===id);
  if(lead) return lead;
  return staffList.find(s=>s.id===id) || null;
}
function openStaffDetail(id, returnView){
  if(!findDetailItem(id)) return;
  view = 'detail'; activeStaffId = id; pickerOpen = false;
  detailReturnView = (returnView==='reorder') ? 'reorder' : 'gallery';
  renderApp();
}
function backToGallery(){
  view = detailReturnView || 'gallery';
  activeStaffId = null; pickerOpen = false;
  renderApp();
}

// The list the full-screen viewer swipes through — mirrors wherever
// "detail" was opened FROM: the live (attendance-filtered) gallery, LED by
// the fixed QR/menu slides, when opened from a 本棚 card; or the full
// staff roster alone (no lead slides — there's nothing to manage about a
// fixed image) when opened from 並び替え, so admins can still browse
// everyone's photo there too, same staff set that screen already lists.
function detailNavList(){
  return detailReturnView==='reorder' ? orderedStaffList() : LEAD_SLIDES.concat(visibleGalleryStaffList());
}
// All pointer-driven gestures in the app funnel through these three
// handlers (attached once to #main in init()), branching on whatever
// state the app is currently in. Exactly one of swipeState / longPressInfo
// / gridDrag is ever active at a time, since each only starts under a
// view/mode condition the other two exclude.
function onMainPointerDown(e){
  // ---- full-screen viewer: swipe-to-browse (not once the editor/picker is open) ----
  if(view==='detail' && !pickerOpen){
    if(!e.target.closest('.viewer')) return;
    swipeState = { x: e.clientX, y: e.clientY, pointerId: e.pointerId };
    return;
  }
  // ---- gallery already unlocked for reordering: pick a card straight up ----
  if(view==='gallery' && galleryReorderMode){
    const card = e.target.closest('.book-card');
    if(!card) return;
    const rect = card.getBoundingClientRect();
    gridDrag = {
      id: card.dataset.id, pointerId: e.pointerId, el: card, moved: false,
      grabDX: e.clientX - (rect.left + rect.width/2), grabDY: e.clientY - (rect.top + rect.height/2),
      naturalCX: rect.left + rect.width/2, naturalCY: rect.top + rect.height/2,
      halfW: rect.width/2, halfH: rect.height/2,
    };
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
    card.classList.add('dragging');
    return;
  }
  // ---- plain gallery: start timing a long-press to unlock reordering ----
  if(view==='gallery' && !galleryReorderMode){
    const card = e.target.closest('.book-card');
    if(!card) return;
    longPressInfo = { id: card.dataset.id, x: e.clientX, y: e.clientY, pointerId: e.pointerId, fired: false };
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(()=>{
      if(!longPressInfo) return;
      longPressInfo.fired = true;
      suppressNextClick = true;
      card.classList.add('dragging'); // quick visual cue: "this is now armed"
    }, LONG_PRESS_MS);
  }
}
function onMainPointerMove(e){
  if(longPressInfo && longPressInfo.pointerId===e.pointerId && !longPressInfo.fired){
    const dx = e.clientX - longPressInfo.x, dy = e.clientY - longPressInfo.y;
    if(Math.hypot(dx, dy) > LONG_PRESS_MOVE_TOLERANCE){
      clearTimeout(longPressTimer);
      longPressInfo = null;
    }
    return;
  }
  if(gridDrag && gridDrag.pointerId===e.pointerId){
    const x = e.clientX - gridDrag.grabDX, y = e.clientY - gridDrag.grabDY;
    gridDrag.el.style.transform = 'translate(' + (x - gridDrag.naturalCX) + 'px,' + (y - gridDrag.naturalCY) + 'px) scale(1.06)';
    // Only swap once the DRAGGED card's own footprint (its size, centered on
    // where it's currently being held) reaches over another slot's center —
    // not just "whichever other card happens to be nearest," which with only
    // two cards is trivially always true and would swap back and forth on
    // every single pointermove. This is the standard "crossed the midpoint"
    // rule sortable lists use, just applied in both x and y for a grid.
    let targetId = null;
    document.querySelectorAll('.book-card[data-id]').forEach(c=>{
      if(targetId || c===gridDrag.el) return;
      const r = c.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      if(Math.abs(x-cx) < gridDrag.halfW && Math.abs(y-cy) < gridDrag.halfH) targetId = c.dataset.id;
    });
    if(targetId && targetId!==gridDrag.id){
      const from = galleryDragOrder.indexOf(gridDrag.id);
      const to = galleryDragOrder.indexOf(targetId);
      if(from!==-1 && to!==-1 && from!==to){
        galleryDragOrder.splice(from, 1);
        galleryDragOrder.splice(to, 0, gridDrag.id);
        gridDrag.moved = true;
        const draggedId = gridDrag.id, pointerId = gridDrag.pointerId;
        renderApp();
        // The dragged card is a brand-new DOM node after that re-render —
        // re-acquire it and re-apply the drag visuals so it keeps tracking
        // the finger instead of snapping back to its new resting slot.
        const freshEl = document.querySelector('.book-card[data-id="' + CSS.escape(draggedId) + '"]');
        if(freshEl){
          const r2 = freshEl.getBoundingClientRect();
          gridDrag.el = freshEl; gridDrag.naturalCX = r2.left + r2.width/2; gridDrag.naturalCY = r2.top + r2.height/2;
          gridDrag.halfW = r2.width/2; gridDrag.halfH = r2.height/2;
          freshEl.classList.add('dragging');
          freshEl.style.transform = 'translate(' + (x - gridDrag.naturalCX) + 'px,' + (y - gridDrag.naturalCY) + 'px) scale(1.06)';
          try{ freshEl.setPointerCapture(pointerId); }catch(err){}
        }
      }
    }
  }
}
function onMainPointerUp(e){
  if(longPressInfo && longPressInfo.pointerId===e.pointerId){
    const firedLongPress = longPressInfo.fired;
    const card = document.querySelector('.book-card[data-id="' + CSS.escape(longPressInfo.id) + '"]');
    if(card) card.classList.remove('dragging');
    clearTimeout(longPressTimer);
    longPressInfo = null;
    if(firedLongPress){
      if(visibleGalleryStaffList().length < 2){ showToast('並べ替えには出勤中のスタッフが2人以上必要です'); return; }
      showPasswordModal(()=>{ startGalleryReorder(); });
    }
    return;
  }
  if(gridDrag && gridDrag.pointerId===e.pointerId){
    const el = gridDrag.el, moved = gridDrag.moved;
    gridDrag = null;
    if(el){ el.classList.remove('dragging'); el.style.transform = ''; }
    if(moved) persistGalleryDragOrder();
    return;
  }
  if(!swipeState || e.pointerId!==swipeState.pointerId) return;
  const dx = e.clientX - swipeState.x;
  const dy = e.clientY - swipeState.y;
  swipeState = null;
  if(Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return; // too short / too vertical to count as a swipe
  navigateDetail(dx < 0 ? 1 : -1); // swiped left -> next, swiped right -> previous
}
function navigateDetail(dir){
  const list = detailNavList();
  const idx = list.findIndex(s=>s.id===activeStaffId);
  if(idx===-1) return;
  const next = idx + dir;
  if(next<0 || next>=list.length) return; // clamp at the ends, no wraparound
  activeStaffId = list[next].id;
  renderApp();
}

// Reordering is also password-gated (every time, same as photo editing) —
// it's a management action too, even though it never touches photo data.
function requestReorder(){
  showPasswordModal(()=>{
    view = 'reorder';
    renderApp();
  });
}
function backFromReorder(){
  view = 'gallery';
  renderApp();
}

// ---------- gallery drag-to-reorder (long-press to unlock, see onMainPointer*) ----------
function startGalleryReorder(){
  galleryReorderMode = true;
  galleryDragOrder = visibleGalleryStaffList().map(s=>s.id);
  renderApp();
}
function finishGalleryReorder(){
  galleryReorderMode = false;
  gridDrag = null;
  renderApp();
}
// Keeps the working drag order in sync if attendance changes mid-reorder
// (someone clocks in/out while a card is being dragged) without resetting
// whatever the admin has already rearranged.
function reconcileGalleryDragOrder(){
  const liveIds = visibleGalleryStaffList().map(s=>s.id);
  const liveSet = {}; liveIds.forEach(id=>{ liveSet[id] = true; });
  galleryDragOrder = galleryDragOrder.filter(id=>liveSet[id]);
  const existing = {}; galleryDragOrder.forEach(id=>{ existing[id] = true; });
  liveIds.forEach(id=>{ if(!existing[id]) galleryDragOrder.push(id); });
}
// Splices the dragged subset's new relative order back into the full
// roster order, leaving every staff member NOT currently shown in the
// gallery exactly where they already were — dragging only ever reorders
// people relative to each other among who's visible right now.
function applyVisibleReorder(newVisibleIds){
  const full = orderedStaffList().map(s=>s.id);
  const visibleSet = {}; newVisibleIds.forEach(id=>{ visibleSet[id] = true; });
  let vi = 0;
  return full.map(id=> visibleSet[id] ? newVisibleIds[vi++] : id);
}
async function persistGalleryDragOrder(){
  const newOrder = applyVisibleReorder(galleryDragOrder);
  staffOrder = newOrder;
  if(!db) return;
  try{ await db.doc('otokohonOrder').set({ order: newOrder, ts: Date.now() }); }
  catch(e){ showToast('並び替えの保存に失敗しました'); }
}
// Swaps the staff at `id` with its neighbor one step up (dir -1) or down
// (dir +1) and saves the full order immediately — no separate save step,
// matching how every other change in this app writes as soon as it's made.
// The local update happens first so the row moves instantly even before
// the write round-trips (this sandbox's own verification showed that
// round-trip can lag on a flaky connection; a real one is near-instant).
async function moveStaff(id, dir){
  const ids = orderedStaffList().map(s=>s.id);
  const idx = ids.indexOf(id);
  const next = idx + dir;
  if(idx===-1 || next<0 || next>=ids.length) return;
  [ids[idx], ids[next]] = [ids[next], ids[idx]];
  staffOrder = ids;
  renderApp();
  if(!db) return;

  catch(e){ showToast('並び替えの保存に失敗しました'); }
}
// Lets the admin type an exact 1-indexed position instead of tapping ▲▼
// repeatedly — built so a whole month's sales ranking (順位) can be typed
// in staff-by-staff and the gallery/reorder order follows it immediately,
// writing into the exact same otokohonOrder used everywhere else. An
// invalid or no-op entry just re-renders, which snaps the input back to
// the current real position (reorderRowHtml always derives value from the
// live order), so there's nothing to validate beyond "is this a number".
async function setStaffPosition(id, rawValue){
  const ids = orderedStaffList().map(s=>s.id);
  const from = ids.indexOf(id);
  if(from===-1){ renderApp(); return; }
  const parsed = parseInt(String(rawValue).replace(/[^0-9]/g,''), 10);
  if(!Number.isFinite(parsed) || parsed<1){ renderApp(); return; }
  const to = Math.min(ids.length, parsed) - 1;
  if(to===from){ renderApp(); return; }
  ids.splice(from, 1);
  ids.splice(to, 0, id);
  staffOrder = ids;
  renderApp();
  if(!db) return;
  try{ await db.doc('otokohonOrder').set({ order: ids, ts: Date.now() }); }
  catch(e){ showToast('並び替えの保存に失敗しました'); }
}

/* ---------- monthly name-rank import (「9月ナンバー」など) ---------- */

// Matches staff names against the pasted ナンバー表 a little more loosely
// than exact string equality: trims stray leading/trailing spaces and
// folds full-width digits/letters/spaces to half-width (Unicode NFKC), so
// a name retyped with an extra space or typed on an IME that slipped in a
// zenkaku character still matches. An un-matched name is otherwise
// invisible: that person just never gets picked up by the automatic
// ナンバー順 placement, with nothing in the UI to explain why (see the
// "ナンバー表に未登録" hint in reorderRowHtml, which surfaces exactly this
// case to the admin instead of leaving it silent).
//
// otokohon-21: a stage name routinely gets written in several different
// scripts across different systems/people (hiragana とむ in one place,
// katakana トム in another, a romanized "TOM"/"tom" somewhere else — the
// exact report that prompted this) — so on top of NFKC, this also folds
// katakana to hiragana for comparison (treating ヴ/ゔ as interchangeable
// with ブ/ぶ, since Japanese has no native "v" sound and a stylized name
// like いぶ/イヴ is written with either one depending on who typed it), and,
// for a name written in plain ASCII letters, converts it from romaji to
// hiragana via a conservative mora-by-mora table — only when the ENTIRE
// name parses cleanly as recognized syllables, so an unrelated word never
// gets guessed into a false match. None of this folds two genuinely
// DIFFERENT names into each other (かなで and みやび, say, still normalize
// to themselves and nothing else) — it only unifies different spellings of
// the same sounds. For anything script-folding still can't bridge (an
// unrelated nickname, not a spelling variant), the ナンバー表 itself
// accepts several aliases for one rank, separated by "/" — expanded into
// independent same-rank entries by expandNameRankAliases at save time
// (see saveRankImport), well before anything reaches Firebase (Realtime
// Database keys can't contain "/"); rebuildNameRankTableNormalized's own
// split below just stays as a harmless defensive no-op on top of that.
function kataToHiraForMatch(s){
  return s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function foldVuRowForMatch(s){
  return s.replace(/[ヴゔ]/g, m => (m === 'ヴ' ? 'ブ' : 'ぶ')); // ヴ->ブ, ゔ->ぶ
}
// Conservative romaji->hiragana mora table (Hepburn-ish, with common Kunrei
// alternates). Greedy longest-match (3-letter digraphs, then 2-letter mora,
// then 1-letter). A doubled consonant becomes a small っ. A single leftover
// consonant at the very end (e.g. "tom" ending in "m" with no vowel) gets an
// implicit trailing "u" filled in — the most common way an English-spelled
// nickname elides the final Japanese vowel (とむ="tomu"→casually "tom").
// Anything that still doesn't fully resolve returns null: no guessing.
const ROMAJI_MORA3 = {
  kya:'きゃ',kyu:'きゅ',kyo:'きょ', sha:'しゃ',shu:'しゅ',sho:'しょ', sya:'しゃ',syu:'しゅ',syo:'しょ',
  cha:'ちゃ',chu:'ちゅ',cho:'ちょ', tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ', nya:'にゃ',nyu:'にゅ',nyo:'にょ',
  hya:'ひゃ',hyu:'ひゅ',hyo:'ひょ', mya:'みゃ',myu:'みゅ',myo:'みょ', rya:'りゃ',ryu:'りゅ',ryo:'りょ',
  gya:'ぎゃ',gyu:'ぎゅ',gyo:'ぎょ', jya:'じゃ',jyu:'じゅ',jyo:'じょ', bya:'びゃ',byu:'びゅ',byo:'びょ',
  pya:'ぴゃ',pyu:'ぴゅ',pyo:'ぴょ',
};
const ROMAJI_MORA2 = {
  ka:'か',ki:'き',ku:'く',ke:'け',ko:'こ', sa:'さ',shi:'し',si:'し',su:'す',se:'せ',so:'そ',
  ta:'た',chi:'ち',ti:'ち',tsu:'つ',tu:'つ',te:'て',to:'と', na:'な',ni:'に',nu:'ぬ',ne:'ね',no:'の',
  ha:'は',hi:'ひ',fu:'ふ',hu:'ふ',he:'へ',ho:'ほ', ma:'ま',mi:'み',mu:'む',me:'め',mo:'も',
  ya:'や',yu:'ゆ',yo:'よ', ra:'ら',ri:'り',ru:'る',re:'れ',ro:'ろ', wa:'わ',wo:'を',
  ga:'が',gi:'ぎ',gu:'ぐ',ge:'げ',go:'ご', za:'ざ',ji:'じ',zi:'じ',zu:'ず',ze:'ぜ',zo:'ぞ',
  da:'だ',di:'ぢ',du:'づ',de:'で',do:'ど', ba:'ば',bi:'び',bu:'ぶ',be:'べ',bo:'ぼ',
  pa:'ぱ',pi:'ぴ',pu:'ぷ',pe:'ぺ',po:'ぽ',
};
const ROMAJI_MORA1 = { a:'あ',i:'い',u:'う',e:'え',o:'お' };
function romajiToHiraOrNull(lower){
  if(!/^[a-z]+$/.test(lower)) return null;
  let i = 0, out = '';
  const n = lower.length;
  while(i < n){
    if(i+1 < n && lower[i]===lower[i+1] && !'aeioun'.includes(lower[i])){ out += 'っ'; i += 1; continue; }
    const three = lower.slice(i, i+3), two = lower.slice(i, i+2), one = lower.slice(i, i+1);
    if(ROMAJI_MORA3[three]){ out += ROMAJI_MORA3[three]; i += 3; continue; }
    if(ROMAJI_MORA2[two]){ out += ROMAJI_MORA2[two]; i += 2; continue; }
    if(one === 'n'){ out += 'ん'; i += 1; continue; }
    if(ROMAJI_MORA1[one]){ out += ROMAJI_MORA1[one]; i += 1; continue; }
    if(i === n-1 && 'bcdfgkmprstz'.includes(one) && ROMAJI_MORA2[one+'u']){ out += ROMAJI_MORA2[one+'u']; i += 1; continue; }
    return null;
  }
  return out;
}
function normalizeNameForMatch(name){
  let s = String(name||'').normalize('NFKC').trim().replace(/\s+/g, ' ');
  s = foldVuRowForMatch(kataToHiraForMatch(s));
  if(/^[a-zA-Z]+$/.test(s)){
    const conv = romajiToHiraOrNull(s.toLowerCase());
    if(conv) s = conv;
  }
  return s;
}
let nameRankTableNormalized = {}; // normalized-name -> rank, rebuilt whenever nameRankTable changes
function rebuildNameRankTableNormalized(){
  const next = {};
  // Each ナンバー表 line's name field may itself list several aliases for
  // the same person separated by "/" (e.g. "とむ/トム/TOM/tom\t1") — register
  // all of them against the same rank. Script-folding above already unifies
  // that exact example on its own; the "/" list is for anything it can't
  // reach, like a genuinely different nickname.
  Object.keys(nameRankTable||{}).forEach(nameOrAliases=>{
    String(nameOrAliases).split('/').forEach(alias=>{
      const norm = normalizeNameForMatch(alias);
      if(norm) next[norm] = nameRankTable[nameOrAliases];
    });
  });
  nameRankTableNormalized = next;
}
function rankForStaffName(name){
  return nameRankTableNormalized[normalizeNameForMatch(name)];
}

// Inserts `id` (whose stored rank is `rank`) right before the first OTHER
// ranked-and-photographed staff member with an equal-or-larger rank number
// — i.e. in order relative to its ranked peers only. Unranked people (or
// ranked people without a photo yet) are skipped over wherever they
// happen to sit rather than used as a stopping point, since a manual ▲▼
// move can freely scatter them anywhere, including ahead of every ranked
// person; stopping at the first one (instead of skipping past it) would
// wrongly treat "ranked block starts at the front" as a fixed rule. Falls
// back to the very end when no larger-or-equal ranked peer exists.
function insertByNameRank(order, id, rank){
  const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
  const withoutId = order.filter(x=>x!==id);
  let insertAt = withoutId.length;
  for(let i=0;i<withoutId.length;i++){
    const other = byId[withoutId[i]];
    const otherRank = other && rankForStaffName(other.name);
    const otherHasPhoto = other && !!staffPhotos[other.id];
    if(other && Number.isFinite(otherRank) && otherHasPhoto && otherRank>=rank){ insertAt = i; break; }
  }
  withoutId.splice(insertAt, 0, id);
  return withoutId;
}

// Explicit, one-shot bulk apply: every staff member who (a) already has a
// 宣材写真 right now and (b) has a name-matched entry in nameRankTable moves
// into a contiguous block at the front, sorted by that rank. Everyone else
// (no entry, or ranked but no photo yet) keeps their existing relative
// order, appended after. Called only when the admin explicitly saves the
// ranking table — ongoing "slot in once the photo appears" is handled one
// person at a time by applyRankToNewlyEligibleStaff instead, so it never
// re-fights manual reordering done afterward.
function applyNameRankOrderNow(){
  const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
  const current = orderedStaffList().map(s=>s.id);
  const ranked = [], rest = [];
  current.forEach(id=>{
    const s = byId[id];
    const rank = s && rankForStaffName(s.name);
    if(s && Number.isFinite(rank) && staffPhotos[id]) ranked.push({ id, rank });
    else rest.push(id);
  });
  ranked.sort((a,b)=>a.rank-b.rank);
  return ranked.map(r=>r.id).concat(rest);
}

// Slots any staff member who currently has BOTH a 宣材写真 AND a
// name-matched rank in nameRankTable into that rank position, exactly once
// each — "名前が同じやつは写真上がったら勝手にナンバー並び替えになる様にし
// て". Never touches anyone else's position, so it can't undo a manual
// reorder done by hand since.
//
// "Already placed" (rankApplied) is saved to Firebase rather than kept only
// in this tab's memory. That matters because the 宣材写真 itself is
// uploaded from X8 TIME CHECK, often on a different device — if nobody
// happened to have 男本 open at that exact moment, there was no tab around
// to notice the photo "newly" appearing, and whichever tab opened next
// could no longer tell "always had this photo" apart from "just got it", so
// the person was silently skipped forever ("追記で写真入っても売上順に更新
// する様にして"). Tracking "applied" as a persisted fact instead of a
// same-session diff fixes that: this function is safe to call on every
// staffPhotos/nameRankTable/otokohonRankApplied update, including the very
// first one after load, with no "first snapshot is just a baseline" special
// case needed any more — whoever opens the app next simply catches up
// anyone eligible that nobody got to yet.
function applyRankToNewlyEligibleStaff(){
  if(rankApplied===null) return; // otokohonRankApplied hasn't loaded yet; its own first snapshot re-runs this
  const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
  const eligible = Object.keys(staffPhotos)
    .filter(id=>byId[id] && !rankApplied[id])
    .map(id=>({ id, s: byId[id], rank: rankForStaffName(byId[id].name) }))
    .filter(m=>Number.isFinite(m.rank))
    .sort((a,b)=>a.rank-b.rank); // process in rank order, in case several are caught up at once
  if(!eligible.length) return;
  let order = orderedStaffList().map(s=>s.id);
  eligible.forEach(m=>{ order = insertByNameRank(order, m.id, m.rank); });
  staffOrder = order;
  const patch = {};
  eligible.forEach(m=>{ patch[m.id] = true; });
  rankApplied = Object.assign({}, rankApplied, patch);
  renderApp();
  if(db){
    db.doc('otokohonOrder').set({ order, ts: Date.now() }).catch(()=>{});
    db.doc('otokohonRankApplied').update(patch).catch(()=>{});
  }
  showToast(eligible.map(m=>m.s.name).join('、') + ' をナンバー順に自動配置しました');
}

// Formats the saved table back into pasteable "name␉rank" lines, sorted by
// rank, so re-opening the screen shows the current state for review/editing
// rather than a blank box.
function formatNameRankTable(table){
  return Object.keys(table||{})
    .map(name=>({ name, rank: table[name] }))
    .sort((a,b)=>a.rank-b.rank)
    .map(e=>`${e.name}\t${e.rank}`)
    .join('\n');
}

// Parses pasted lines of "name <tab/comma/spaces> number" — exactly what a
// 2-column copy from Excel/OneDrive pastes as (tab-separated, one row per
// line) — into a {name: rank} map. Blank lines and lines with no trailing
// number are silently skipped rather than rejecting the whole paste.
function parseRankImportText(text){
  const table = {};
  String(text||'').split(/\r?\n/).forEach(line=>{
    const trimmed = line.trim();
    if(!trimmed) return;
    const m = trimmed.match(/^(.*\S)[\t,\s]+(\d+)\s*$/);
    if(m) table[m[1].trim()] = parseInt(m[2], 10);
  });
  return table;
}

// otokohon-21: an explicit "/"-combined alias line (e.g. "くまこ/ちび\t4")
// must NEVER reach nameRankTable — and therefore Firebase — with its "/"
// still literally inside one object key. Realtime Database forbids ".",
// "#", "$", "/", "[", and "]" in a key (it's reserved as a path
// separator there), and db.doc(...).set() throws synchronously the
// instant it sees one — confirmed directly against this project's own
// RTDB: "set failed: ... contains an invalid key (くまこ/ちび)" — which
// silently fails to save the WHOLE table, not just the alias line, since
// the entire parsed object is written in one set() call. So every
// "/"-separated alias is split out into its OWN independent {alias:
// rank} entry right here, immediately after parsing and before anything
// is assigned to nameRankTable or reaches Firebase — the saved table
// itself ends up perfectly flat, with every key already a plain single
// name. (rebuildNameRankTableNormalized's own "/"-split further down
// still runs on top of this and stays harmless: splitting an
// already-slash-free string by "/" is just a no-op, so it remains a
// defensive second layer rather than the thing actually protecting
// Firebase.) The one visible trade-off: reopening ナンバー登録 after
// saving an alias line shows it as two separate same-rank lines rather
// than the original combined "a/b" text — functionally identical, just
// no longer visually grouped as one line.
function expandNameRankAliases(table){
  const out = {};
  Object.keys(table||{}).forEach(nameOrAliases=>{
    String(nameOrAliases).split('/').forEach(alias=>{
      const trimmed = alias.trim();
      if(trimmed) out[trimmed] = table[nameOrAliases];
    });
  });
  return out;
}

function openRankImport(){
  rankImportDraft = null;
  view = 'rankImport';
  renderApp();
}
function backFromRankImport(){
  rankImportDraft = null;
  view = 'reorder';
  renderApp();
}
async function saveRankImport(){
  const ta = document.getElementById('rankImportTextarea');
  const text = ta ? ta.value : (rankImportDraft || '');
  const parsed = expandNameRankAliases(parseRankImportText(text));
  const count = Object.keys(parsed).length;
  if(!count){ showToast('「名前　数字」の行が見つかりませんでした'); return; }
  nameRankTable = parsed;
  rebuildNameRankTableNormalized();
  // Everyone who already has a photo right now is "already accounted for"
  // as of this save — applyNameRankOrderNow() just placed them (or, if
  // unranked, deliberately left them where they were) — so mark them
  // applied here too, same as the order write below, so
  // applyRankToNewlyEligibleStaff doesn't redo this for them later. Anyone
  // without a photo yet stays un-applied, ready to be picked up
  // automatically whenever their 宣材写真 eventually appears.
  const accountedFor = {};
  Object.keys(staffPhotos).forEach(id=>{ accountedFor[id] = true; });
  rankApplied = Object.assign({}, rankApplied, accountedFor);
  const newOrder = applyNameRankOrderNow();
  staffOrder = newOrder;
  rankImportDraft = null;
  view = 'reorder';
  renderApp();
  if(!db) return;
  try{
    await db.doc('otokohonNameRank').set(parsed);
    await db.doc('otokohonOrder').set({ order: newOrder, ts: Date.now() });
    await db.doc('otokohonRankApplied').update(accountedFor);
    const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
    const appliedNow = newOrder.filter(id=>{
      const s = byId[id];
      return s && Number.isFinite(parsed[s.name]) && staffPhotos[id];
    }).length;
    showToast(count + '件を保存しました（今すぐ反映: ' + appliedNow + '人。写真が未登録の人は、写真が上がり次第自動で反映されます）');
  }catch(e){ showToast('ナンバーの保存に失敗しました'); }
}
