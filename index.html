<style>
:root{
  --bg:#131019;
  --bg-elev:#1b1725;
  --surface:#221d30;
  --surface2:#2b2440;
  --border:#3a3350;
  --gold:#cda449;
  --gold-dim:#8a7233;
  --gold-soft:rgba(205,164,73,0.15);
  --indigo:#7d8cff;
  --danger:#e5535a;
  --danger-soft:rgba(229,83,90,0.15);
  --success:#38caa0;
  --success-soft:rgba(56,202,160,0.15);
  --text:#f3f0ea;
  --text-dim:#a79fc0;
  --text-faint:#6d6585;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Noto Sans JP', sans-serif;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; }
button{cursor:pointer;}
#app{display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; position:relative;}

/* ===== header ===== */
header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, var(--bg-elev), var(--bg));
  gap:8px; min-height:48px;
}
.brand{display:flex; align-items:center; gap:8px; min-width:0;}
.brand .mark{
  font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1px;
  font-size:18px; color:var(--gold); border:1.5px solid var(--gold); border-radius:6px;
  padding:2px 7px 2px 8px; text-align:center; line-height:1.3; flex:0 0 auto;
}
.brand .titles{min-width:0;}
.brand .sub{font-size:11px; color:var(--text-faint); letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand .page-title{font-size:13.5px; color:var(--text-dim); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.header-title-center{font-size:14.5px; color:var(--text); font-weight:800; text-align:center; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.header-spacer{width:38px; flex:0 0 auto;}

/* ===== main ===== */
main{flex:1 1 auto; overflow-y:auto; padding:16px 14px calc(28px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch;}
.section-title{font-size:12.5px; color:var(--gold); letter-spacing:1px; font-weight:700; margin:20px 0 8px;}
.section-title:first-child{margin-top:0;}
.hint{font-size:12.5px; color:var(--text-faint); margin:0 0 14px; text-align:center;}
.btn{
  background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:11px;
  padding:12px 14px; font-size:14px; font-family:inherit; font-weight:700;
}
.btn:active{transform:scale(0.97);}
.btn.gold{background:var(--gold); color:#221a05; border-color:var(--gold);}
.btn.ghost{background:none; border:1px solid var(--border); color:var(--text-dim); font-weight:500;}
.btn.block{width:100%;}
.btn.icon-only{padding:9px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:18px;}
.btn:disabled{opacity:0.4;}
input:focus{outline:2px solid var(--gold); outline-offset:1px;}
.empty-hint{color:var(--text-faint); font-size:12.5px; text-align:center; padding:26px 10px; border:1px dashed var(--border); border-radius:var(--radius);}
.visually-hidden-file{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
::-webkit-scrollbar{width:0; height:0;}

/* ===== gallery (本棚) ===== */
.book-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.book-card{
  position:relative; aspect-ratio:3/4; border-radius:var(--radius); overflow:hidden;
  border:1px solid var(--border); background:var(--surface); padding:0; display:block; width:100%;
}
.book-card:active{transform:scale(0.97);}
.book-photo{width:100%; height:100%; object-fit:cover; display:block;}
.book-photo.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(10,8,14,0.55);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:54px;
}
.book-name-wrap{
  position:absolute; left:0; right:0; bottom:0; padding:22px 10px 10px;
  background:linear-gradient(0deg, rgba(10,8,14,0.9), rgba(10,8,14,0));
}
.book-name{color:#fff; font-size:14px; font-weight:700; text-align:center; text-shadow:0 1px 4px rgba(0,0,0,0.6);}

/* ===== detail ===== */
.detail-hero{display:flex; justify-content:center; margin:6px 0 16px;}
.detail-photo{
  width:220px; height:280px; object-fit:cover; border-radius:var(--radius);
  border:1px solid var(--border); box-shadow:0 14px 34px rgba(0,0,0,0.4); display:block;
}
.detail-photo.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(10,8,14,0.55);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:72px;
}
.detail-name{text-align:center; font-size:19px; font-weight:800; color:var(--text); margin-bottom:4px;}
.detail-sub{text-align:center; font-size:12px; color:var(--text-faint); margin-bottom:16px;}

.picker{margin-top:22px; padding-top:18px; border-top:1px solid var(--border);}
.promo-row{display:flex; gap:10px; flex-wrap:wrap;}
.promo-tile{
  position:relative; width:92px; height:92px; border-radius:12px; overflow:hidden;
  border:2px solid var(--border); background:var(--surface2); padding:0; display:block;
}
.promo-tile.active{border-color:var(--gold);}
.promo-tile img{width:100%; height:100%; object-fit:cover; display:block;}
.promo-tile.upload-tile{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  border-style:dashed; color:var(--text-dim);
}
.upload-plus{font-size:22px; color:var(--gold); line-height:1;}
.upload-label{font-size:10px; text-align:center; padding:0 4px;}
.check{
  position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
  background:var(--gold); color:#221a05; font-size:12px; font-weight:900;
  display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.4);
}
.clockin-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.clockin-tile{
  position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden;
  border:2px solid var(--border); background:var(--surface2); padding:0; display:block;
}
.clockin-tile.active{border-color:var(--gold);}
.clockin-tile img{width:100%; height:100%; object-fit:cover; display:block;}
.clockin-label{
  position:absolute; left:0; right:0; bottom:0; padding:2px 0; text-align:center;
  background:rgba(10,8,14,0.75); color:#fff; font-size:9px; font-family:'Oswald',sans-serif; letter-spacing:0.3px;
}

/* ===== reorder (並び替え) ===== */
.reorder-list{display:flex; flex-direction:column; gap:8px;}
.reorder-row{
  display:flex; align-items:center; gap:10px; padding:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:12px;
}
.reorder-thumb{width:44px; height:44px; border-radius:10px; object-fit:cover; flex:0 0 auto; border:1px solid var(--border);}
.reorder-thumb.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(10,8,14,0.55);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:17px;
}
.reorder-name{flex:1 1 auto; min-width:0; font-size:14px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.reorder-btns{display:flex; gap:6px; flex:0 0 auto;}
.reorder-btns .btn{width:34px; height:34px; padding:0; font-size:13px;}
.reorder-btns .btn:disabled{opacity:0.25;}

/* ===== modal ===== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,8,14,0.72); z-index:150;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.modal-box{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; width:100%; max-width:320px;
}
.modal-message{font-size:14.5px; color:var(--text); margin-bottom:14px; line-height:1.5; text-align:center;}
.modal-input{
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:10px 12px; font-size:16px; font-family:inherit; width:100%; text-align:center; letter-spacing:4px;
  margin-bottom:8px;
}
.modal-error{color:var(--danger); font-size:12.5px; text-align:center; margin-bottom:8px;}
.modal-actions{display:flex; gap:8px; margin-top:6px;}
.modal-actions .btn{flex:1;}

/* ===== toast ===== */
#toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px);
  background:var(--danger); color:#fff; padding:10px 16px; border-radius:20px; font-size:13px; font-weight:600;
  z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:80%; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <header id="headerInner"></header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<input type="file" accept="image/*" id="promoPhotoFileInput" class="visually-hidden-file">

<script type="module">
'use strict';
/* =========================================================================
   X8 イケメンリスト（内部名: otokohon）— 宣材写真 / 出勤時の写真から選べるスタッフ名鑑
   データ層: Firebase Realtime Database — X8 TIME CHECKと同じプロジェクト
   （x8clean）の timecheck/ を共有する（名簿は config/staff、宣材写真は
   staffPhotos/ をTIME CHECKの設定タブとそのまま共有。出勤時の顔写真は
   attendance/ + photos/ を読み取り専用で参照する）。このアプリ独自の
   データは「どの写真を表示するか」のポインタ otokohonSelection/ のみ。
   ホスティング: GitHub Pages（誰でもアクセス可、Claudeのサインイン不要）。
   ========================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getDatabase,
  ref as fbRef,
  get as fbGet,
  set as fbSet,
  update as fbUpdate,
  onValue as fbOnValue
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const BUILD_STAMP = 'otokohon-2 - 2026-10-08';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDfHz5djZU4ZsJKY9DsfQOJt3D7pdSOHqU",
  authDomain: "x8clean.firebaseapp.com",
  databaseURL: "https://x8clean-default-rtdb.firebaseio.com",
  projectId: "x8clean",
  storageBucket: "x8clean.firebasestorage.app",
  messagingSenderId: "716422687785",
  appId: "1:716422687785:web:3d18478a3c301580ea4038"
};
// Same top-level key as X8 TIME CHECK on purpose — 男本 is a dedicated
// browsing/selection UI over that same staff/photo data, not a separate
// data domain (unlike X8 OPEN CHECK, which keeps its own key).
const DB_PREFIX = 'timecheck';
function fullPath(path){ return DB_PREFIX + '/' + path; }

// Same shared deterrent code as the rest of the X8 suite — not real
// security, just a casual-staff speed bump before changing a photo.
const MANAGEMENT_PASSWORD = '6666';

let db = null;
let rtdb = null;

/* ---------- thin db adapter (ported as-is from X8 TIME CHECK) ---------- */
function wrapSnap(fbSnap, id){
  const exists = fbSnap.exists();
  return { id, exists, data: () => exists ? fbSnap.val() : undefined };
}
function makeDocRef(path){
  const segs = path.split('/');
  const id = segs[segs.length-1];
  return {
    id,
    async get(){ const snap = await fbGet(fbRef(rtdb, fullPath(path))); return wrapSnap(snap, id); },
    async set(data){ await fbSet(fbRef(rtdb, fullPath(path)), data); },
    async update(patch){
      const flat = {};
      (function flatten(prefix, obj){
        for(const k in obj){
          const v = obj[k];
          const key = prefix ? prefix + '/' + k : k;
          if(v && typeof v==='object' && !Array.isArray(v)) flatten(key, v);
          else flat[key] = v;
        }
      })('', patch);
      await fbUpdate(fbRef(rtdb, fullPath(path)), flat);
    },
    onSnapshot(next, errCb){
      const r = fbRef(rtdb, fullPath(path));
      return fbOnValue(
        r,
        (snap)=>{ try{ next(wrapSnap(snap, id)); }catch(e){} },
        (err)=>{ if(errCb) errCb({ code:'unavailable', message: err && err.message }); }
      );
    }
  };
}

/* ---------- helpers (ported as-is from X8 TIME CHECK) ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function monthKeyOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const STAFF_COLORS = ['#cda449','#7d8cff','#38caa0','#e5535a','#c98bd8','#5fb0d9','#e6a15c','#7ad1c9'];
function colorFor(id){ let h=0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0; return STAFF_COLORS[h % STAFF_COLORS.length]; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{ t.classList.remove('show'); }, 2600);
}
function loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (err)=>{ URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}
function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
// Same quality ladder as X8 TIME CHECK's own 宣材写真 upload — this app
// writes to the exact same staffPhotos/{id} node, so it should produce the
// exact same kind of file.
const STAFF_PHOTO_ATTEMPTS = [
  { w: 640, q: 0.78 },
  { w: 560, q: 0.72 },
  { w: 480, q: 0.68 },
  { w: 400, q: 0.6 },
  { w: 320, q: 0.55 },
  { w: 240, q: 0.5 },
];
const STAFF_PHOTO_MAX_CHARS = 350000;
async function makeCompressedDataUrl(fileOrBlob, attempts, capChars){
  let img;
  try{ img = await loadImageFromFile(fileOrBlob); }catch(e){ return null; }
  for(const a of attempts){
    const h = Math.max(1, Math.round(a.w * img.height / img.width));
    const canvas = document.createElement('canvas');
    canvas.width = a.w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, a.w, h);
    const smallBlob = await new Promise(res=>canvas.toBlob(res,'image/jpeg',a.q));
    if(!smallBlob) continue;
    const dataUrl = await blobToDataUrl(smallBlob);
    if(dataUrl.length < capChars) return dataUrl;
  }
  return null;
}

/* ---------- state ---------- */
let staffList = [];              // [{id,name}] from config/staff (current roster only)
let staffPhotos = {};            // {id: dataUrl} from staffPhotos/ (shared with X8 TIME CHECK)
let selection = {};              // {id: {kind:'staffPhoto'} | {kind:'clockin', monthKey, dayKey, eid, photo}} from otokohonSelection/
let resolvedGalleryPhotos = {};  // {id: dataUrl|null} — selection resolved down to an actual displayable photo
const inlinePhotoCache = {};     // photos/{id} doc id -> dataUrl, avoids refetching the same clock-in photo repeatedly

let staffOrder = null;           // [id,...] from otokohonOrder — custom display order for THIS app only
                                  // (never touches config/staff itself, so X8 TIME CHECK's own staff-select
                                  // grid keeps whatever order it already has)

let view = 'gallery';            // 'gallery' | 'detail' | 'reorder'
let activeStaffId = null;
let pickerOpen = false;          // whether the password-gated photo picker is revealed in detail view
let candidatePhotos = [];        // recent clock-in photos for the staff currently open in detail view
let candidatesLoading = false;

let modalState = null;

/* ---------- firebase subscriptions ---------- */
async function init(){
  try{
    const fbApp = initializeApp(FIREBASE_CONFIG);
    rtdb = getDatabase(fbApp);
    db = { doc: makeDocRef };
  }catch(e){ db = null; rtdb = null; }
  subscribeStaff();
  subscribeStaffPhotos();
  subscribeSelection();
  subscribeStaffOrder();
  renderApp();
  document.getElementById('app').addEventListener('click', onAppClick);
  document.getElementById('toast').addEventListener('click', ()=>{ document.getElementById('toast').classList.remove('show'); });
  document.getElementById('promoPhotoFileInput').addEventListener('change', onPromoPhotoFileSelected);
}

function subscribeStaff(){
  if(!db){ renderApp(); return; }
  db.doc('config/staff').onSnapshot(
    (snap)=>{
      const data = snap.exists ? snap.data() : null;
      staffList = (data && Array.isArray(data.list)) ? data.list : [];
      refreshResolvedGalleryPhotos();
      renderApp();
    },
    ()=>{ renderApp(); }
  );
}

function subscribeStaffPhotos(){
  if(!db) return;
  db.doc('staffPhotos').onSnapshot(
    (snap)=>{
      const raw = (snap.exists && snap.data()) || {};
      const flat = {};
      for(const id in raw){ if(raw[id] && raw[id].dataUrl) flat[id] = raw[id].dataUrl; }
      staffPhotos = flat;
      refreshResolvedGalleryPhotos();
      renderApp();
    },
    ()=>{}
  );
}

function subscribeSelection(){
  if(!db) return;
  db.doc('otokohonSelection').onSnapshot(
    (snap)=>{
      selection = (snap.exists && snap.data()) || {};
      refreshResolvedGalleryPhotos();
      renderApp();
    },
    ()=>{}
  );
}

function subscribeStaffOrder(){
  if(!db) return;
  db.doc('otokohonOrder').onSnapshot(
    (snap)=>{
      const data = snap.exists ? snap.data() : null;
      staffOrder = (data && Array.isArray(data.order)) ? data.order : null;
      renderApp();
    },
    ()=>{}
  );
}

// The display order this app shows (gallery grid + reorder screen): the
// saved order, limited to staff who still exist, with any staff NOT yet in
// it (brand new, or before anyone has ever reordered) appended at the end
// in their natural config/staff order. Never mutates config/staff itself.
function orderedStaffList(){
  const byId = {};
  staffList.forEach(s=>{ byId[s.id] = s; });
  const saved = Array.isArray(staffOrder) ? staffOrder.filter(id=>byId[id]) : [];
  const missing = staffList.map(s=>s.id).filter(id=>!saved.includes(id));
  return saved.concat(missing).map(id=>byId[id]);
}

async function resolveInlinePhoto(photoRef){
  if(!photoRef || !photoRef.startsWith('inline:')) return null;
  const id = photoRef.slice(7);
  if(id in inlinePhotoCache) return inlinePhotoCache[id];
  try{
    const snap = await db.doc('photos/' + id).get();
    const url = (snap.exists && snap.data().dataUrl) || null;
    inlinePhotoCache[id] = url;
    return url;
  }catch(e){ return null; }
}

// Resolves each staff member's CURRENTLY DISPLAYED photo: their selection
// pointer if one has been set (either the 宣材写真 slot or a specific
// clock-in capture), otherwise falls back to the 宣材写真 slot directly —
// so a club that's never touched 男本 yet still shows whatever's already
// uploaded in X8 TIME CHECK's settings, with zero setup required.
async function refreshResolvedGalleryPhotos(){
  const ids = staffList.map(s=>s.id);
  const next = {};
  await Promise.all(ids.map(async id=>{
    const sel = selection[id];
    if(sel && sel.kind==='clockin' && sel.photo){
      next[id] = await resolveInlinePhoto(sel.photo);
    } else {
      next[id] = staffPhotos[id] || null;
    }
  }));
  resolvedGalleryPhotos = next;
  renderApp();
}

/* ---------- clock-in photo candidates ---------- */
// Scans the current + previous 2 months of this staff member's own
// attendance doc (the exact same attendance/{id}_{monthKey} path X8 TIME
// CHECK's own log view reads) for 出勤(type:'in') events that have a
// photo attached, newest first, capped to a reasonable scrollable amount —
// entirely read-only, so X8 TIME CHECK itself never needs to change.
async function loadClockinCandidates(staffId){
  candidatesLoading = true; candidatePhotos = [];
  renderApp();
  if(!db){ candidatesLoading = false; renderApp(); return; }
  try{
    const now = new Date();
    const monthKeys = Array.from(new Set([0,1,2].map(n=>{
      const d = new Date(now.getFullYear(), now.getMonth()-n, 1);
      return monthKeyOf(d);
    })));
    const docs = await Promise.all(monthKeys.map(async mk=>{
      try{ const snap = await db.doc('attendance/' + staffId + '_' + mk).get(); return snap.exists ? { mk, data: snap.data() } : null; }
      catch(e){ return null; }
    }));
    let evs = [];
    docs.forEach(entry=>{
      if(!entry) return;
      const days = entry.data.days || {};
      Object.keys(days).forEach(dayKey=>{
        const list = (days[dayKey] && Array.isArray(days[dayKey].events)) ? days[dayKey].events : [];
        list.forEach(ev=>{
          if(ev.type==='in' && !ev.deleted && ev.photo){
            evs.push({ eid: ev.id || ('ts:'+ev.ts), monthKey: entry.mk, dayKey, time: ev.time, ts: ev.ts, photo: ev.photo });
          }
        });
      });
    });
    evs.sort((a,b)=>b.ts-a.ts);
    evs = evs.slice(0, 18);
    await Promise.all(evs.map(async e=>{ e.dataUrl = await resolveInlinePhoto(e.photo); }));
    candidatePhotos = evs.filter(e=>e.dataUrl);
  }catch(e){ candidatePhotos = []; }
  candidatesLoading = false;
  if(view==='detail' && activeStaffId===staffId) renderApp();
}

/* ---------- actions ---------- */
function openStaffDetail(id){
  const staff = staffList.find(s=>s.id===id);
  if(!staff) return;
  view = 'detail'; activeStaffId = id; pickerOpen = false; candidatePhotos = []; candidatesLoading = false;
  renderApp();
}
function backToGallery(){
  view = 'gallery'; activeStaffId = null; pickerOpen = false; candidatePhotos = [];
  renderApp();
}

// Reordering is also password-gated (every time, same as photo editing) —
// it's a management action too, even though it never touches photo data.
function requestReorder(){
  showPasswordModal(()=>{
    view = 'reorder';
    renderApp();
  });
}
function backFromReorder(){
  view = 'gallery';
  renderApp();
}
// Swaps the staff at `id` with its neighbor one step up (dir -1) or down
// (dir +1) and saves the full order immediately — no separate save step,
// matching how every other change in this app writes as soon as it's made.
// The local update happens first so the row moves instantly even before
// the write round-trips (this sandbox's own verification showed that
// round-trip can lag on a flaky connection; a real one is near-instant).
async function moveStaff(id, dir){
  const ids = orderedStaffList().map(s=>s.id);
  const idx = ids.indexOf(id);
  const next = idx + dir;
  if(idx===-1 || next<0 || next>=ids.length) return;
  [ids[idx], ids[next]] = [ids[next], ids[idx]];
  staffOrder = ids;
  renderApp();
  if(!db) return;
  try{ await db.doc('otokohonOrder').set({ order: ids, ts: Date.now() }); }
  catch(e){ showToast('並び替えの保存に失敗しました'); }
}

// Password is asked every time, never cached for the session — matches
// how ログ/設定 work in X8 TIME CHECK.
function requestEditPhoto(id){
  showPasswordModal(()=>{
    pickerOpen = true;
    renderApp();
    loadClockinCandidates(id);
  });
}

async function selectStaffPhotoAsActive(staffId){
  if(!db){ showToast('データ保存を利用できません'); return; }
  try{
    await db.doc('otokohonSelection/' + staffId).set({ kind:'staffPhoto', ts: Date.now() });
    showToast('写真を変更しました');
  }catch(e){ showToast('変更に失敗しました'); }
}
async function selectClockinPhotoAsActive(staffId, cand){
  if(!db){ showToast('データ保存を利用できません'); return; }
  try{
    await db.doc('otokohonSelection/' + staffId).set({
      kind:'clockin', monthKey: cand.monthKey, dayKey: cand.dayKey, eid: cand.eid, photo: cand.photo, ts: Date.now()
    });
    showToast('写真を変更しました');
  }catch(e){ showToast('変更に失敗しました'); }
}

// Uploads write to staffPhotos/{id} — the SAME node X8 TIME CHECK's own
// 設定 tab manages — so a new 宣材写真 added from either app shows up in
// both, and immediately becomes the active 男本 photo.
function pickPromoPhotoFile(){
  const input = document.getElementById('promoPhotoFileInput');
  if(input) input.click();
}
async function onPromoPhotoFileSelected(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  const staffId = activeStaffId;
  if(!file || !staffId || !db) return;
  showToast('写真をアップロード中…');
  try{
    const dataUrl = await makeCompressedDataUrl(file, STAFF_PHOTO_ATTEMPTS, STAFF_PHOTO_MAX_CHARS);
    if(!dataUrl){ showToast('写真の処理に失敗しました'); return; }
    await db.doc('staffPhotos/' + staffId).set({ dataUrl, ts: Date.now() });
    await db.doc('otokohonSelection/' + staffId).set({ kind:'staffPhoto', ts: Date.now() });
    showToast('写真を登録しました');
  }catch(err){ showToast('写真の保存に失敗しました'); }
}

/* ---------- modal (password only) ---------- */
function showPasswordModal(onSuccess){
  modalState = { kind:'password', error:'', onSuccess };
  renderModal();
}
function closeModal(){ modalState = null; renderModal(); }
function submitModalPassword(){
  if(!modalState) return;
  const inp = document.getElementById('modalPasswordInput');
  const val = inp ? inp.value : '';
  if(val === MANAGEMENT_PASSWORD){
    const cb = modalState.onSuccess;
    closeModal();
    if(cb) cb();
  } else {
    modalState = Object.assign({}, modalState, { error:'パスワードが違います' });
    renderModal();
  }
}
function renderModal(){
  let el = document.getElementById('modalEl');
  if(!modalState){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id = 'modalEl'; el.className = 'modal-overlay'; document.getElementById('app').appendChild(el); }
  el.innerHTML = `
    <div class="modal-box">
      <div class="modal-message">パスワードを入力してください</div>
      <input type="password" inputmode="numeric" autocomplete="off" class="modal-input" id="modalPasswordInput">
      ${modalState.error ? `<div class="modal-error">${escapeHtml(modalState.error)}</div>` : ''}
      <div class="modal-actions">
        <button class="btn ghost block" data-action="modalCancel">キャンセル</button>
        <button class="btn gold block" data-action="modalPasswordSubmit">確認</button>
      </div>
    </div>
  `;
  const inp = document.getElementById('modalPasswordInput');
  if(inp){
    inp.focus();
    inp.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') submitModalPassword(); });
  }
  el.onclick = (ev)=>{ if(ev.target===el) closeModal(); };
}

/* ---------- click dispatch ---------- */
function onAppClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='openStaffDetail') openStaffDetail(el.dataset.id);
  else if(action==='backToGallery') backToGallery();
  else if(action==='requestReorder') requestReorder();
  else if(action==='backFromReorder') backFromReorder();
  else if(action==='moveStaffUp') moveStaff(el.dataset.id, -1);
  else if(action==='moveStaffDown') moveStaff(el.dataset.id, 1);
  else if(action==='requestEditPhoto') requestEditPhoto(el.dataset.id);
  else if(action==='selectStaffPhoto') selectStaffPhotoAsActive(el.dataset.id);
  else if(action==='selectClockinPhoto'){
    const c = candidatePhotos.find(x=>x.eid===el.dataset.eid);
    if(c) selectClockinPhotoAsActive(el.dataset.id, c);
  }
  else if(action==='pickPromoPhotoFile') pickPromoPhotoFile();
  else if(action==='modalCancel') closeModal();
  else if(action==='modalPasswordSubmit') submitModalPassword();
}

/* ---------- render ---------- */
function renderApp(){
  const header = document.getElementById('headerInner');
  const main = document.getElementById('main');
  if(view==='detail'){
    const staff = staffList.find(s=>s.id===activeStaffId);
    header.innerHTML = `
      <button class="btn icon-only ghost" data-action="backToGallery">‹</button>
      <div class="header-title-center">${escapeHtml(staff ? staff.name : '')}</div>
      <div class="header-spacer"></div>
    `;
    main.innerHTML = detailHtml(staff);
  } else if(view==='reorder'){
    header.innerHTML = `
      <button class="btn icon-only ghost" data-action="backFromReorder">‹</button>
      <div class="header-title-center">並び替え</div>
      <div class="header-spacer"></div>
    `;
    main.innerHTML = reorderHtml();
  } else {
    header.innerHTML = `
      <div class="brand">
        <div class="mark">X8</div>
        <div class="titles">
          <div class="sub">イケメンリスト</div>
          <div class="page-title">タップして写真を見る</div>
        </div>
      </div>
      <button class="btn icon-only ghost" data-action="requestReorder" title="並び替え">⇅</button>
    `;
    main.innerHTML = galleryHtml();
  }
  renderModal();
}

function galleryHtml(){
  const list = orderedStaffList();
  if(!list.length){
    return `<div class="empty-hint">スタッフが登録されていません<br>（X8 TIME CHECKの設定タブで登録してください）</div>`;
  }
  return `<div class="book-grid">${list.map(s=>bookCardHtml(s)).join('')}</div>`;
}
function bookCardHtml(s){
  const photo = resolvedGalleryPhotos[s.id];
  return `
    <button class="book-card" data-action="openStaffDetail" data-id="${escapeHtml(s.id)}">
      ${photo
        ? `<img class="book-photo" src="${photo}" alt="">`
        : `<div class="book-photo placeholder" style="background:${colorFor(s.id)}">${escapeHtml((s.name||'?').slice(0,1))}</div>`}
      <div class="book-name-wrap"><div class="book-name">${escapeHtml(s.name)}</div></div>
    </button>
  `;
}

function detailHtml(staff){
  if(!staff) return `<div class="empty-hint">スタッフが見つかりません</div>`;
  const photo = resolvedGalleryPhotos[staff.id];
  return `
    <div class="detail-hero">
      ${photo
        ? `<img class="detail-photo" src="${photo}" alt="">`
        : `<div class="detail-photo placeholder" style="background:${colorFor(staff.id)}">${escapeHtml((staff.name||'?').slice(0,1))}</div>`}
    </div>
    <div class="detail-name">${escapeHtml(staff.name)}</div>
    <button class="btn gold block" data-action="requestEditPhoto" data-id="${escapeHtml(staff.id)}" style="margin-top:14px;">写真を選ぶ・変更する</button>
    ${pickerOpen ? pickerHtml(staff) : ''}
    <div class="hint" style="margin-top:28px;">バージョン ${escapeHtml(BUILD_STAMP)}</div>
  `;
}

function pickerHtml(staff){
  const sel = selection[staff.id];
  const isStaffPhotoActive = !sel || sel.kind==='staffPhoto';
  const promo = staffPhotos[staff.id];
  return `
    <div class="picker">
      <div class="section-title">宣材写真</div>
      <div class="promo-row">
        ${promo ? `
          <button class="promo-tile ${isStaffPhotoActive ? 'active' : ''}" data-action="selectStaffPhoto" data-id="${escapeHtml(staff.id)}">
            <img src="${promo}" alt="">
            ${isStaffPhotoActive ? '<div class="check">✓</div>' : ''}
          </button>
        ` : ''}
        <button class="promo-tile upload-tile" data-action="pickPromoPhotoFile" data-id="${escapeHtml(staff.id)}">
          <div class="upload-plus">＋</div><div class="upload-label">${promo ? '差し替え' : 'アップロード'}</div>
        </button>
      </div>

      <div class="section-title">出勤時の写真から選ぶ</div>
      ${candidatesLoading
        ? `<div class="empty-hint">読み込み中…</div>`
        : (candidatePhotos.length
          ? `<div class="clockin-grid">${candidatePhotos.map(c=>clockinTileHtml(staff.id, c, sel)).join('')}</div>`
          : `<div class="empty-hint">最近の出勤時の写真がまだありません</div>`)}
    </div>
  `;
}
function clockinTileHtml(staffId, c, sel){
  const active = !!(sel && sel.kind==='clockin' && sel.eid===c.eid);
  const label = c.monthKey.slice(5,7) + '/' + c.dayKey + ' ' + c.time;
  return `
    <button class="clockin-tile ${active ? 'active' : ''}" data-action="selectClockinPhoto" data-id="${escapeHtml(staffId)}" data-eid="${escapeHtml(c.eid)}">
      <img src="${c.dataUrl}" alt="">
      ${active ? '<div class="check">✓</div>' : ''}
      <div class="clockin-label">${escapeHtml(label)}</div>
    </button>
  `;
}

function reorderHtml(){
  const list = orderedStaffList();
  if(!list.length) return `<div class="empty-hint">スタッフが登録されていません</div>`;
  return `
    <div class="hint" style="margin-bottom:14px;">▲▼でイケメンリストに並ぶ順番を変えられます</div>
    <div class="reorder-list">${list.map((s,i)=>reorderRowHtml(s, i, list.length)).join('')}</div>
  `;
}
function reorderRowHtml(s, i, total){
  const photo = resolvedGalleryPhotos[s.id];
  return `
    <div class="reorder-row">
      ${photo
        ? `<img class="reorder-thumb" src="${photo}" alt="">`
        : `<div class="reorder-thumb placeholder" style="background:${colorFor(s.id)}">${escapeHtml((s.name||'?').slice(0,1))}</div>`}
      <div class="reorder-name">${escapeHtml(s.name)}</div>
      <div class="reorder-btns">
        <button class="btn icon-only ghost" data-action="moveStaffUp" data-id="${escapeHtml(s.id)}" ${i===0 ? 'disabled' : ''}>▲</button>
        <button class="btn icon-only ghost" data-action="moveStaffDown" data-id="${escapeHtml(s.id)}" ${i===total-1 ? 'disabled' : ''}>▼</button>
      </div>
    </div>
  `;
}

init();
</script>
</body>
</html>
