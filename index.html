<style>
:root{
  --bg:#131019;
  --bg-elev:#1b1725;
  --surface:#221d30;
  --surface2:#2b2440;
  --border:#3a3350;
  --gold:#d4af37;
  --gold-dim:#8a7233;
  --gold-soft:rgba(212,175,55,0.15);
  --gold-grad:linear-gradient(135deg, #f6e2a8 0%, #d4af37 45%, #9c7a2e 100%);
  --indigo:#7d8cff;
  --danger:#e5535a;
  --danger-soft:rgba(229,83,90,0.15);
  --success:#38caa0;
  --success-soft:rgba(56,202,160,0.15);
  --text:#f3f0ea;
  --text-dim:#a79fc0;
  --text-faint:#6d6585;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 130% 45% at 50% 0%, rgba(212,175,55,0.16), transparent 62%),
    var(--bg);
  color:var(--text);
  font-family:'Noto Sans JP', sans-serif;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; }
button{cursor:pointer;}
#app{display:flex; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto; position:relative;}

/* ===== header ===== */
header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, var(--bg-elev), var(--bg));
  gap:8px; min-height:48px; position:relative;
}
header::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:var(--gold-grad); opacity:0.55;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0;}
.brand .mark{
  font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:1px;
  font-size:18px; color:#241a05; background:var(--gold-grad); border-radius:7px;
  padding:3px 8px 3px 9px; text-align:center; line-height:1.3; flex:0 0 auto;
  box-shadow:0 2px 10px rgba(212,175,55,0.4);
}
.brand .titles{min-width:0;}
.brand .sub{
  font-family:'Great Vibes', cursive; font-weight:400;
  font-size:27px; line-height:1.15; letter-spacing:0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:var(--gold-grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,0.35));
}
.brand .page-title{font-size:11.5px; color:var(--text-faint); font-weight:600; letter-spacing:0.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.live-dot{
  display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--success);
  margin-right:5px; box-shadow:0 0 6px rgba(56,202,160,0.85); vertical-align:middle;
  animation:liveDotPulse 1.8s ease-in-out infinite;
}
@keyframes liveDotPulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
.header-title-center{font-size:14.5px; color:var(--text); font-weight:800; text-align:center; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.header-spacer{width:38px; flex:0 0 auto;}

/* ===== main ===== */
main{flex:1 1 auto; overflow-y:auto; padding:16px 14px calc(28px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch;}
.section-title{font-size:12.5px; color:var(--gold); letter-spacing:1px; font-weight:700; margin:20px 0 8px;}
.section-title:first-child{margin-top:0;}
.hint{font-size:12.5px; color:var(--text-faint); margin:0 0 14px; text-align:center;}
.btn{
  background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:11px;
  padding:12px 14px; font-size:14px; font-family:inherit; font-weight:700;
}
.btn:active{transform:scale(0.97);}
.btn.gold{background:var(--gold-grad); color:#221a05; border-color:transparent; box-shadow:0 4px 14px rgba(212,175,55,0.35);}
.btn.ghost{background:none; border:1px solid var(--border); color:var(--text-dim); font-weight:500;}
.btn.ghost.danger{border-color:var(--danger-soft); color:var(--danger); background:var(--danger-soft);}
.btn.block{width:100%;}
.btn.icon-only{padding:9px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:18px;}
.btn:disabled{opacity:0.4;}
input:focus, textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
.empty-hint{color:var(--text-faint); font-size:12.5px; text-align:center; padding:26px 10px; border:1px dashed var(--border); border-radius:var(--radius);}
.visually-hidden-file{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
::-webkit-scrollbar{width:0; height:0;}

/* ===== gallery (本棚) ===== */
.book-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.book-card{
  position:relative; aspect-ratio:3/4; border-radius:var(--radius); overflow:hidden;
  border:1px solid var(--border); background:var(--surface); padding:0; display:block; width:100%;
  box-shadow:0 8px 20px rgba(0,0,0,0.45);
}
.book-card::before{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:2;
  box-shadow:inset 0 0 0 1px rgba(230,195,120,0.35);
}
.book-card:active{transform:scale(0.97);}
.book-photo{width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none;}
.book-photo.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(10,8,14,0.55);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:34px;
}
.book-live-dot{
  position:absolute; top:7px; right:7px; z-index:3; width:8px; height:8px; border-radius:50%;
  background:var(--success); box-shadow:0 0 8px rgba(56,202,160,0.9), 0 0 0 2px rgba(10,8,14,0.55);
  animation:liveDotPulse 1.8s ease-in-out infinite;
}
.book-card.drag-mode{touch-action:none;}
.book-card.dragging{z-index:50; box-shadow:0 10px 26px rgba(0,0,0,0.55); cursor:grabbing;}

/* ===== detail ===== */
.detail-hero{display:flex; justify-content:center; margin:6px 0 16px;}
.detail-photo{
  width:220px; height:280px; object-fit:cover; border-radius:var(--radius);
  border:1px solid rgba(230,195,120,0.4); display:block;
  box-shadow:0 14px 34px rgba(0,0,0,0.5), 0 0 0 1px rgba(230,195,120,0.15);
}
.detail-photo.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(10,8,14,0.55);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:72px;
}
.detail-name{text-align:center; font-size:19px; font-weight:800; color:var(--text); margin-bottom:4px;}
.detail-sub{text-align:center; font-size:12px; color:var(--text-faint); margin-bottom:16px;}

/* ===== full-screen photo viewer (tap a card, before the edit picker opens) ===== */
main.full-bleed{padding:0; overflow:hidden;}
.viewer{position:relative; width:100%; height:100%; background:#0a080e; touch-action:pan-y;}
.viewer-photo{width:100%; height:100%; object-fit:cover; display:block; animation:viewerFade .18s ease; -webkit-user-drag:none; user-select:none;}
.viewer-photo.placeholder{
  display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.3);
  font-family:'Oswald',sans-serif; font-weight:700; font-size:120px;
}
@keyframes viewerFade{ from{opacity:0;} to{opacity:1;} }
.viewer-foot{
  position:absolute; left:0; right:0; bottom:0; padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg, rgba(0,0,0,0.78), rgba(0,0,0,0));
  display:flex; align-items:flex-end; justify-content:flex-end; gap:10px;
}
.viewer-count{
  color:#fff; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;
  border:1px solid rgba(230,195,120,0.6); border-radius:20px; padding:4px 11px; background:rgba(10,8,14,0.45);
  margin-bottom:3px;
}
.viewer-edit-btn{
  position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:2;
  width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.3);
  background:rgba(10,8,14,0.55); color:#fff; font-size:16px; padding:0;
  display:flex; align-items:center; justify-content:center;
}
.viewer-edit-btn:active{transform:scale(0.92);}

<script type="module">
'use strict';
/* =========================================================================
   X8 イケメンリスト（内部名: otokohon）— 宣材写真 / 出勤時の写真から選べるスタッフ名鑑
   データ層: Firebase Realtime Database — X8 TIME CHECKと同じプロジェクト
   （x8clean）の timecheck/ を共有する（名簿は config/staff、宣材写真は
   staffPhotos/ をTIME CHECKの設定タブとそのまま共有。出勤時の顔写真は
   attendance/ + photos/ を読み取り専用で参照する）。このアプリ独自の
   データは「どの写真を表示するか」のポインタ otokohonSelection/ のみ。
   ホスティング: GitHub Pages（誰でもアクセス可、Claudeのサインイン不要）。
   ========================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getDatabase,
  ref as fbRef,
  get as fbGet,
  set as fbSet,
  update as fbUpdate,
  onValue as fbOnValue
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const BUILD_STAMP = 'otokohon-14 - 2026-10-09';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDfHz5djZU4ZsJKY9DsfQOJt3D7pdSOHqU",
  authDomain: "x8clean.firebaseapp.com",
  databaseURL: "https://x8clean-default-rtdb.firebaseio.com",
  projectId: "x8clean",
  storageBucket: "x8clean.firebasestorage.app",
  messagingSenderId: "716422687785",
  appId: "1:716422687785:web:3d18478a3c301580ea4038"
};
// Same top-level key as X8 TIME CHECK on purpose — 男本 is a dedicated
// browsing/selection UI over that same staff/photo data, not a separate
// data domain (unlike X8 OPEN CHECK, which keeps its own key).
const DB_PREFIX = 'timecheck';
function fullPath(path){ return DB_PREFIX + '/' + path; }

// Same shared deterrent code as the rest of the X8 suite — not real
// security, just a casual-staff speed bump before changing a photo.
const MANAGEMENT_PASSWORD = '6666';

let db = null;
let rtdb = null;

/* ---------- thin db adapter (ported as-is from X8 TIME CHECK) ---------- */
function wrapSnap(fbSnap, id){
  const exists = fbSnap.exists();
  return { id, exists, data: () => exists ? fbSnap.val() : undefined };
}
function makeDocRef(path){
  const segs = path.split('/');
  const id = segs[segs.length-1];
  return {
    id,
    async get(){ const snap = await fbGet(fbRef(rtdb, fullPath(path))); return wrapSnap(snap, id); },
    async set(data){ await fbSet(fbRef(rtdb, fullPath(path)), data); },
    async update(patch){
      const flat = {};
      (function flatten(prefix, obj){
        for(const k in obj){
          const v = obj[k];
          const key = prefix ? prefix + '/' + k : k;
          if(v && typeof v==='object' && !Array.isArray(v)) flatten(key, v);
          else flat[key] = v;
        }
      })('', patch);
      await fbUpdate(fbRef(rtdb, fullPath(path)), flat);
    },
    onSnapshot(next, errCb){
      const r = fbRef(rtdb, fullPath(path));
      return fbOnValue(
        r,
        (snap)=>{ try{ next(wrapSnap(snap, id)); }catch(e){} },
        (err)=>{ if(errCb) errCb({ code:'unavailable', message: err && err.message }); }
      );
    }
  };
}

/* ---------- helpers (ported as-is from X8 TIME CHECK) ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function monthKeyOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1); }
function dayKeyOf(d){ return pad2(d.getDate()); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const STAFF_COLORS = ['#cda449','#7d8cff','#38caa0','#e5535a','#c98bd8','#5fb0d9','#e6a15c','#7ad1c9'];
function colorFor(id){ let h=0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0; return STAFF_COLORS[h % STAFF_COLORS.length]; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{ t.classList.remove('show'); }, 2600);
}
function loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (err)=>{ URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}
function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
// Same quality ladder as X8 TIME CHECK's own 宣材写真 upload — this app
// writes to the exact same staffPhotos/{id} node, so it should produce the
// exact same kind of file.
const STAFF_PHOTO_ATTEMPTS = [
  { w: 640, q: 0.78 },
  { w: 560, q: 0.72 },
  { w: 480, q: 0.68 },
  { w: 400, q: 0.6 },
  { w: 320, q: 0.55 },
  { w: 240, q: 0.5 },
];
const STAFF_PHOTO_MAX_CHARS = 350000;
async function makeCompressedDataUrl(fileOrBlob, attempts, capChars){
  let img;
  try{ img = await loadImageFromFile(fileOrBlob); }catch(e){ return null; }
  for(const a of attempts){
    const h = Math.max(1, Math.round(a.w * img.height / img.width));
    const canvas = document.createElement('canvas');
    canvas.width = a.w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, a.w, h);
    const smallBlob = await new Promise(res=>canvas.toBlob(res,'image/jpeg',a.q));
    if(!smallBlob) continue;
    const dataUrl = await blobToDataUrl(smallBlob);
    if(dataUrl.length < capChars) return dataUrl;
  }
  return null;
}

/* ---------- state ---------- */
let staffList = [];              // [{id,name}] from config/staff (current roster only)
let staffPhotos = {};            // {id: dataUrl} from staffPhotos/ (shared with X8 TIME CHECK)
let selection = {};              // {id: {kind:'staffPhoto'} | {kind:'clockin', monthKey, dayKey, eid, photo}} from otokohonSelection/
let resolvedGalleryPhotos = {};  // {id: dataUrl|null} — selection resolved down to an actual displayable photo
const inlinePhotoCache = {};     // photos/{id} doc id -> dataUrl, avoids refetching the same clock-in photo repeatedly

let staffOrder = null;           // [id,...] from otokohonOrder — custom display order for THIS app only
                                  // (never touches config/staff itself, so X8 TIME CHECK's own staff-select
                                  // grid keeps whatever order it already has)

let excludedStaff = {};          // {id: true} from otokohonExcluded — staff flagged 運営 (operations/
                                  // management, not a customer-facing host): even once clocked in with
                                  // a photo in X8 TIME CHECK, they never appear in THIS app's gallery.
                                  // Stored separately from config/staff, same as otokohonOrder — X8 TIME
                                  // CHECK itself is never touched or made aware of this flag.

let galleryHidden = {};          // {id: true} from otokohonGalleryHidden — staff clocked in with NO
                                  // photo yet (e.g. a new host's first shift, before any 宣材写真 or
                                  // clock-in photo exists for them), manually hidden from THIS app's
                                  // gallery via the picker screen. Unlike excludedStaff/運営 (a
                                  // permanent "not customer facing" flag the admin sets and unsets by
                                  // hand), this one is self-correcting: the moment ANY photo becomes
                                  // available for that staff member, it's cleared automatically — see
                                  // clearGalleryHiddenWherePhotoAppeared(). Stored separately, same
                                  // pattern as otokohonOrder/otokohonExcluded.

// A pasted-in monthly ranking ("9月ナンバー" etc.), keyed by NAME (not id)
// so it can be prepared before someone even has a 宣材写真 yet, and still
// matches them once they do. See handleNewlyPhotographedStaff / openRankImport.
let nameRankTable = {};          // {name: rankNumber} from otokohonNameRank
let knownPhotoStaffIds = null;   // Set of ids with a staffPhotos entry as of the last snapshot; null
                                  // until the first snapshot. Diffed on every update to catch a 宣材写真
                                  // newly appearing, without ever touching anyone else's position.
let rankImportDraft = null;      // live textarea contents for the ナンバー登録 screen, kept in JS state
                                  // (not just the DOM) so an unrelated Firebase update mid-paste can't
                                  // wipe out what the admin is in the middle of typing; null = show the
                                  // saved table instead of a draft.

// Live "who's currently in" status, so the gallery can show only staff who
// are presently clocked in (promotional photo appears on 出勤, disappears
// on 退勤) — this is a customer-facing "who's working tonight" board, not
// a full staff directory. One onSnapshot listener per staff member, kept
// in sync with staffList by syncAttendanceSubscriptions().
let attendanceStatus = {};       // {id: boolean} — true while currently clocked in today
const attendanceUnsubs = {};     // {id: unsubscribe fn}
let todayMonthKey = monthKeyOf(new Date());
let todayDayKey = dayKeyOf(new Date());

let view = 'gallery';            // 'gallery' | 'detail' | 'reorder'
let detailReturnView = 'gallery'; // which view the back button from 'detail' returns to
let activeStaffId = null;
let pickerOpen = false;          // whether the password-gated photo picker is revealed in detail view
let candidatePhotos = [];        // recent clock-in photos for the staff currently open in detail view
let candidatesLoading = false;
let swipeState = null;           // {x,y,pointerId} mid-drag in the full-screen viewer (swipe to browse)

// Long-press a photo in the LIVE gallery (the screen customers see) to
// unlock drag-to-reorder right there, password-gated the same as every
// other management action in this app. Once unlocked, every card can be
// picked up and dragged (no more long-press needed) until 完了 is tapped.
const LONG_PRESS_MS = 500;
const LONG_PRESS_MOVE_TOLERANCE = 10; // px of wobble allowed before a held finger cancels the long-press
let longPressTimer = null;
let longPressInfo = null;        // {id, x, y, pointerId, fired} while a press-and-hold is being timed
let suppressNextClick = false;   // swallows the tap that follows a recognized long-press
let galleryReorderMode = false;  // true while the gallery itself is in drag-to-reorder mode
let galleryDragOrder = [];       // working copy of the visible staff ids, reordered live during a drag
let gridDrag = null;             // {id, pointerId, el, grabDX, grabDY, naturalCX, naturalCY, moved} while a card is being dragged

let modalState = null;

/* ---------- firebase subscriptions ---------- */
async function init(){
  try{
    const fbApp = initializeApp(FIREBASE_CONFIG);
    rtdb = getDatabase(fbApp);
    db = { doc: makeDocRef };
  }catch(e){ db = null; rtdb = null; }
  subscribeStaff();
  subscribeStaffPhotos();
  subscribeSelection();
  subscribeStaffOrder();
  subscribeExcludedStaff();
  subscribeGalleryHidden();
  subscribeNameRankTable();
  renderApp();
  document.getElementById('app').addEventListener('click', onAppClick);
  document.getElementById('app').addEventListener('change', onAppChange);
  document.getElementById('app').addEventListener('keydown', onAppKeydown);
  document.getElementById('app').addEventListener('focusin', onAppFocusIn);
  document.getElementById('app').addEventListener('input', onAppInput);
  document.getElementById('main').addEventListener('pointerdown', onMainPointerDown);
  document.getElementById('main').addEventListener('pointermove', onMainPointerMove);
  document.getElementById('main').addEventListener('pointerup', onMainPointerUp);
  document.getElementById('main').addEventListener('pointercancel', onMainPointerUp);
  // A phone's native "hold to show menu / save image" callout would otherwise
  // fight with our own long-press-to-reorder gesture on a gallery photo.
  document.getElementById('main').addEventListener('contextmenu', (e)=>{ if(e.target.closest('.book-card')) e.preventDefault(); });
  document.getElementById('toast').addEventListener('click', ()=>{ document.getElementById('toast').classList.remove('show'); });
  document.getElementById('promoPhotoFileInput').addEventListener('change', onPromoPhotoFileSelected);
  // Catches a page left open across midnight: without this, the attendance
  // listeners below would keep watching yesterday's (now frozen) doc forever.
  setInterval(refreshTodayKeysAndResubscribe, 60000);
}

function subscribeStaff(){
  if(!db){ renderApp(); return; }
  db.doc('config/staff').onSnapshot(
    (snap)=>{
      const data = snap.exists ? snap.data() : null;
      staffList = (data && Array.isArray(data.list)) ? data.list : [];
      syncAttendanceSubscriptions();
      refreshResolvedGalleryPhotos();
      renderApp();
    },
    ()=>{ renderApp(); }
  );
}

// ---------- live attendance status (gates gallery visibility) ----------
// "Currently in" means: today's non-deleted events include a 出勤 with no
// 退勤 after it yet. Same hasInToday/hasOutToday rule X8 TIME CHECK's own
// clock screen already uses to decide whether to show 出勤 or 退勤 next —
// replicated here rather than reinvented, including its one-shift-a-day
// shape (hasIn && hasOut both true just means "done for today").
function computeInStatus(dayDoc){
  const events = (dayDoc && Array.isArray(dayDoc.events)) ? dayDoc.events : [];
  const live = events.filter(e=>!e.deleted);
  const hasIn = live.some(e=>e.type==='in');
  const hasOut = live.some(e=>e.type==='out');
  return hasIn && !hasOut;
}
function subscribeAttendanceFor(staffId){
  if(!db || attendanceUnsubs[staffId]) return;
  const path = 'attendance/' + staffId + '_' + todayMonthKey;
  attendanceUnsubs[staffId] = db.doc(path).onSnapshot(
    (snap)=>{
      const data = snap.exists ? snap.data() : null;
      const dayDoc = data && data.days && data.days[todayDayKey];
      attendanceStatus[staffId] = computeInStatus(dayDoc);
      renderApp();
    },
    ()=>{}
  );
}
function unsubscribeAttendanceFor(staffId){
  const un = attendanceUnsubs[staffId];
  if(un){ try{ un(); }catch(e){} delete attendanceUnsubs[staffId]; }
  delete attendanceStatus[staffId];
}
// One live listener per CURRENT staff member: adds any newly-registered
// staff, drops anyone removed, so nothing leaks as the roster changes.
function syncAttendanceSubscriptions(){
  const ids = {};
  staffList.forEach(s=>{ ids[s.id] = true; });
  staffList.forEach(s=>subscribeAttendanceFor(s.id));
  Object.keys(attendanceUnsubs).forEach(id=>{ if(!ids[id]) unsubscribeAttendanceFor(id); });
}
// Re-points every attendance listener at today's doc once the date actually
// rolls over, instead of silently listening to a now-frozen old day forever.
function refreshTodayKeysAndResubscribe(){
  const now = new Date();
  const mk = monthKeyOf(now), dk = dayKeyOf(now);
  if(mk===todayMonthKey && dk===todayDayKey) return;
  todayMonthKey = mk; todayDayKey = dk;
  Object.keys(attendanceUnsubs).forEach(unsubscribeAttendanceFor);
  attendanceStatus = {};
  syncAttendanceSubscriptions();
  renderApp();
}

function subscribeStaffPhotos(){
  if(!db) return;
  db.doc('staffPhotos').onSnapshot(
    (snap)=>{
      const raw = (snap.exists && snap.data()) || {};
      const flat = {};
      for(const id in raw){ if(raw[id] && raw[id].dataUrl) flat[id] = raw[id].dataUrl; }
      staffPhotos = flat;
      handleNewlyPhotographedStaff(flat);
      refreshResolvedGalleryPhotos();
      renderApp();
    },
    ()=>{}
  );
}

function subscribeNameRankTable(){
  if(!db) return;
  db.doc('otokohonNameRank').onSnapshot(
    (snap)=>{
      nameRankTable = (snap.exists && snap.data()) || {};
      renderApp();
    },
    ()=>{}
  );
}

function subscribeSelection(){
  if(!db) return;
  db.doc('otokohonSelection').onSnapshot(
    (snap)=>{
      selection = (snap.exists && snap.data()) || {};
      refreshResolvedGalleryPhotos();
      renderApp();
    },
    ()=>{}
  );
}

function subscribeStaffOrder(){
  if(!db) return;
  db.doc('otokohonOrder').onSnapshot(
    (snap)=>{
      const data = snap.exists ? snap.data() : null;
      staffOrder = (data && Array.isArray(data.order)) ? data.order : null;
      renderApp();
    },
    ()=>{}
  );
}

function subscribeExcludedStaff(){
  if(!db) return;
  db.doc('otokohonExcluded').onSnapshot(
    (snap)=>{
      excludedStaff = (snap.exists && snap.data()) || {};
      renderApp();
    },
    ()=>{}
  );
}

function subscribeGalleryHidden(){
  if(!db) return;
  db.doc('otokohonGalleryHidden').onSnapshot(
    (snap)=>{
      galleryHidden = (snap.exists && snap.data()) || {};
      renderApp();
    },
    ()=>{}
  );
}

// The display order this app shows (gallery grid + reorder screen): the
// saved order, limited to staff who still exist, with any staff NOT yet in
// it (brand new, or before anyone has ever reordered) appended at the end
// in their natural config/staff order. Never mutates config/staff itself.
function orderedStaffList(){
  const byId = {};
  staffList.forEach(s=>{ byId[s.id] = s; });
  const saved = Array.isArray(staffOrder) ? staffOrder.filter(id=>byId[id]) : [];
  const missing = staffList.map(s=>s.id).filter(id=>!saved.includes(id));
  return saved.concat(missing).map(id=>byId[id]);
}

// The gallery itself only shows staff who are CURRENTLY clocked in — this
// board is for customers to see who's working right now, not a full staff
// list. 運営 (excludedStaff) never appear here even while clocked in with a
// photo, and neither does anyone manually hidden for having no photo yet
// (galleryHidden). The reorder screen still uses orderedStaffList()
// (everyone, both kinds of hidden staff included), since relative order —
// and the 運営/非表示 toggles themselves — need to be set up for staff
// before their first shift too.
function visibleGalleryStaffList(){
  return orderedStaffList().filter(s=>attendanceStatus[s.id] && !excludedStaff[s.id] && !galleryHidden[s.id]);
}

async function resolveInlinePhoto(photoRef){
  if(!photoRef || !photoRef.startsWith('inline:')) return null;
  const id = photoRef.slice(7);
  if(id in inlinePhotoCache) return inlinePhotoCache[id];
  try{
    const snap = await db.doc('photos/' + id).get();
    const url = (snap.exists && snap.data().dataUrl) || null;
    inlinePhotoCache[id] = url;
    return url;
  }catch(e){ return null; }
}

// Resolves each staff member's CURRENTLY DISPLAYED photo: their selection
// pointer if one has been set (either the 宣材写真 slot or a specific
// clock-in capture), otherwise falls back to the 宣材写真 slot directly —
// so a club that's never touched 男本 yet still shows whatever's already
// uploaded in X8 TIME CHECK's settings, with zero setup required.
//
// staffPhotos/ and otokohonSelection/ are two separate onSnapshot
// listeners, each calling this function on its own whenever either one
// changes. Deleting a photo now writes to BOTH at once (see
// doRemoveStaffPhoto), so their two listener callbacks can fire back to
// back, and two overlapping calls here can finish in the opposite order
// from how they started — an older call (built from since-superseded
// selection/staffPhotos) finishing after a newer one would silently
// overwrite the correct, fresher result with a stale one, and nothing
// after that ever asks for another refresh to undo it. A generation
// counter keeps only the result of whichever call started last.
let resolvedGalleryPhotosGen = 0;
async function refreshResolvedGalleryPhotos(){
  const gen = ++resolvedGalleryPhotosGen;
  const ids = staffList.map(s=>s.id);
  const next = {};
  await Promise.all(ids.map(async id=>{
    const sel = selection[id];
    if(sel && sel.kind==='clockin' && sel.photo){
      next[id] = await resolveInlinePhoto(sel.photo);
    } else {
      next[id] = staffPhotos[id] || null;
    }
  }));
  if(gen !== resolvedGalleryPhotosGen) return; // a newer refresh has since started; this result is stale, discard it
  resolvedGalleryPhotos = next;
  renderApp();
  clearGalleryHiddenWherePhotoAppeared(next);
}

// A staff member hidden via galleryHidden was hidden ONLY because they had
// no photo at the time. The moment a photo shows up for them (宣材写真
// registered, or a clock-in photo resolved above), that reason is gone, so
// clear the flag automatically rather than leaving them stuck hidden until
// someone remembers to go flip it back. Never touches excludedStaff/運営 —
// that one is a deliberate, permanent admin choice unrelated to photos.
async function clearGalleryHiddenWherePhotoAppeared(resolved){
  const toClear = Object.keys(galleryHidden).filter(id=>resolved[id]);
  if(!toClear.length || !db) return;
  const next = Object.assign({}, galleryHidden);
  toClear.forEach(id=>{ delete next[id]; });
  galleryHidden = next;
  renderApp();
  try{ await db.doc('otokohonGalleryHidden').set(next); }
  catch(e){ /* best-effort — worst case it's still hidden and the next refresh tries again */ }
}

/* ---------- clock-in photo candidates ---------- */
// Scans the current + previous 2 months of this staff member's own
// attendance doc (the exact same attendance/{id}_{monthKey} path X8 TIME
// CHECK's own log view reads) for 出勤(type:'in') events that have a
// photo attached, newest first, capped to a reasonable scrollable amount —
// entirely read-only, so X8 TIME CHECK itself never needs to change.
async function loadClockinCandidates(staffId){
  candidatesLoading = true; candidatePhotos = [];
  renderApp();
  if(!db){ candidatesLoading = false; renderApp(); return; }
  try{
    const now = new Date();
    const monthKeys = Array.from(new Set([0,1,2].map(n=>{
      const d = new Date(now.getFullYear(), now.getMonth()-n, 1);
      return monthKeyOf(d);
    })));
    const docs = await Promise.all(monthKeys.map(async mk=>{
      try{ const snap = await db.doc('attendance/' + staffId + '_' + mk).get(); return snap.exists ? { mk, data: snap.data() } : null; }
      catch(e){ return null; }
    }));
    let evs = [];
    docs.forEach(entry=>{
      if(!entry) return;
      const days = entry.data.days || {};
      Object.keys(days).forEach(dayKey=>{
        const list = (days[dayKey] && Array.isArray(days[dayKey].events)) ? days[dayKey].events : [];
        list.forEach(ev=>{
          if(ev.type==='in' && !ev.deleted && ev.photo){
            evs.push({ eid: ev.id || ('ts:'+ev.ts), monthKey: entry.mk, dayKey, time: ev.time, ts: ev.ts, photo: ev.photo });
          }
        });
      });
    });
    evs.sort((a,b)=>b.ts-a.ts);
    evs = evs.slice(0, 18);
    await Promise.all(evs.map(async e=>{ e.dataUrl = await resolveInlinePhoto(e.photo); }));
    candidatePhotos = evs.filter(e=>e.dataUrl);
  }catch(e){ candidatePhotos = []; }
  candidatesLoading = false;
  if(view==='detail' && activeStaffId===staffId) renderApp();
}

// The list the full-screen viewer swipes through — mirrors wherever
// "detail" was opened FROM: the live (attendance-filtered) gallery when
// opened from a 本棚 card, or the full roster when opened from 並び替え
// (so admins can browse everyone's photo there too, same staff set that
// screen already lists).
function detailNavList(){
  return detailReturnView==='reorder' ? orderedStaffList() : visibleGalleryStaffList();
}
// All pointer-driven gestures in the app funnel through these three
// handlers (attached once to #main in init()), branching on whatever
// state the app is currently in. Exactly one of swipeState / longPressInfo
// / gridDrag is ever active at a time, since each only starts under a
// view/mode condition the other two exclude.
function onMainPointerDown(e){
  // ---- full-screen viewer: swipe-to-browse (not once the editor/picker is open) ----
  if(view==='detail' && !pickerOpen){
    if(!e.target.closest('.viewer')) return;
    swipeState = { x: e.clientX, y: e.clientY, pointerId: e.pointerId };
    return;
  }
  // ---- gallery already unlocked for reordering: pick a card straight up ----
  if(view==='gallery' && galleryReorderMode){
    const card = e.target.closest('.book-card');
    if(!card) return;
    const rect = card.getBoundingClientRect();
    gridDrag = {
      id: card.dataset.id, pointerId: e.pointerId, el: card, moved: false,
      grabDX: e.clientX - (rect.left + rect.width/2), grabDY: e.clientY - (rect.top + rect.height/2),
      naturalCX: rect.left + rect.width/2, naturalCY: rect.top + rect.height/2,
      halfW: rect.width/2, halfH: rect.height/2,
    };
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
    card.classList.add('dragging');
    return;
  }
  // ---- plain gallery: start timing a long-press to unlock reordering ----
  if(view==='gallery' && !galleryReorderMode){
    const card = e.target.closest('.book-card');
    if(!card) return;
    longPressInfo = { id: card.dataset.id, x: e.clientX, y: e.clientY, pointerId: e.pointerId, fired: false };
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(()=>{
      if(!longPressInfo) return;
      longPressInfo.fired = true;
      suppressNextClick = true;
      card.classList.add('dragging'); // quick visual cue: "this is now armed"
    }, LONG_PRESS_MS);
  }
}
function onMainPointerMove(e){
  if(longPressInfo && longPressInfo.pointerId===e.pointerId && !longPressInfo.fired){
    const dx = e.clientX - longPressInfo.x, dy = e.clientY - longPressInfo.y;
    if(Math.hypot(dx, dy) > LONG_PRESS_MOVE_TOLERANCE){
      clearTimeout(longPressTimer);
      longPressInfo = null;
    }
    return;
  }
  if(gridDrag && gridDrag.pointerId===e.pointerId){
    const x = e.clientX - gridDrag.grabDX, y = e.clientY - gridDrag.grabDY;
    gridDrag.el.style.transform = 'translate(' + (x - gridDrag.naturalCX) + 'px,' + (y - gridDrag.naturalCY) + 'px) scale(1.06)';
    // Only swap once the DRAGGED card's own footprint (its size, centered on
    // where it's currently being held) reaches over another slot's center —
    // not just "whichever other card happens to be nearest," which with only
    // two cards is trivially always true and would swap back and forth on
    // every single pointermove. This is the standard "crossed the midpoint"
    // rule sortable lists use, just applied in both x and y for a grid.
    let targetId = null;
    document.querySelectorAll('.book-card[data-id]').forEach(c=>{
      if(targetId || c===gridDrag.el) return;
      const r = c.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      if(Math.abs(x-cx) < gridDrag.halfW && Math.abs(y-cy) < gridDrag.halfH) targetId = c.dataset.id;
    });
    if(targetId && targetId!==gridDrag.id){
      const from = galleryDragOrder.indexOf(gridDrag.id);
      const to = galleryDragOrder.indexOf(targetId);
      if(from!==-1 && to!==-1 && from!==to){
        galleryDragOrder.splice(from, 1);
        galleryDragOrder.splice(to, 0, gridDrag.id);
        gridDrag.moved = true;
        const draggedId = gridDrag.id, pointerId = gridDrag.pointerId;
        renderApp();
        // The dragged card is a brand-new DOM node after that re-render —
        // re-acquire it and re-apply the drag visuals so it keeps tracking
        // the finger instead of snapping back to its new resting slot.
        const freshEl = document.querySelector('.book-card[data-id="' + CSS.escape(draggedId) + '"]');
        if(freshEl){
          const r2 = freshEl.getBoundingClientRect();
          gridDrag.el = freshEl; gridDrag.naturalCX = r2.left + r2.width/2; gridDrag.naturalCY = r2.top + r2.height/2;
          gridDrag.halfW = r2.width/2; gridDrag.halfH = r2.height/2;
          freshEl.classList.add('dragging');
          freshEl.style.transform = 'translate(' + (x - gridDrag.naturalCX) + 'px,' + (y - gridDrag.naturalCY) + 'px) scale(1.06)';
          try{ freshEl.setPointerCapture(pointerId); }catch(err){}
        }
      }
    }
  }
}
function onMainPointerUp(e){
  if(longPressInfo && longPressInfo.pointerId===e.pointerId){
    const firedLongPress = longPressInfo.fired;
    const card = document.querySelector('.book-card[data-id="' + CSS.escape(longPressInfo.id) + '"]');
    if(card) card.classList.remove('dragging');
    clearTimeout(longPressTimer);
    longPressInfo = null;
    if(firedLongPress){
      if(visibleGalleryStaffList().length < 2){ showToast('並べ替えには出勤中のスタッフが2人以上必要です'); return; }
      showPasswordModal(()=>{ startGalleryReorder(); });
    }
    return;
  }
  if(gridDrag && gridDrag.pointerId===e.pointerId){
    const el = gridDrag.el, moved = gridDrag.moved;
    gridDrag = null;
    if(el){ el.classList.remove('dragging'); el.style.transform = ''; }
    if(moved) persistGalleryDragOrder();
    return;
  }
  if(!swipeState || e.pointerId!==swipeState.pointerId) return;
  const dx = e.clientX - swipeState.x;
  const dy = e.clientY - swipeState.y;
  swipeState = null;
  if(Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return; // too short / too vertical to count as a swipe
  navigateDetail(dx < 0 ? 1 : -1); // swiped left -> next, swiped right -> previous
}
function navigateDetail(dir){
  const list = detailNavList();
  const idx = list.findIndex(s=>s.id===activeStaffId);
  if(idx===-1) return;
  const next = idx + dir;
  if(next<0 || next>=list.length) return; // clamp at the ends, no wraparound
  activeStaffId = list[next].id;
  candidatePhotos = []; candidatesLoading = false;
  renderApp();
}

// Keeps the working drag order in sync if attendance changes mid-reorder
// (someone clocks in/out while a card is being dragged) without resetting
// whatever the admin has already rearranged.
function reconcileGalleryDragOrder(){
  const liveIds = visibleGalleryStaffList().map(s=>s.id);
  const liveSet = {}; liveIds.forEach(id=>{ liveSet[id] = true; });
  galleryDragOrder = galleryDragOrder.filter(id=>liveSet[id]);
  const existing = {}; galleryDragOrder.forEach(id=>{ existing[id] = true; });
  liveIds.forEach(id=>{ if(!existing[id]) galleryDragOrder.push(id); });
}
// Splices the dragged subset's new relative order back into the full
// roster order, leaving every staff member NOT currently shown in the
// gallery exactly where they already were — dragging only ever reorders
// people relative to each other among who's visible right now.
function applyVisibleReorder(newVisibleIds){
  const full = orderedStaffList().map(s=>s.id);
  const visibleSet = {}; newVisibleIds.forEach(id=>{ visibleSet[id] = true; });
  let vi = 0;
  return full.map(id=> visibleSet[id] ? newVisibleIds[vi++] : id);
}
async function persistGalleryDragOrder(){
  const newOrder = applyVisibleReorder(galleryDragOrder);
  staffOrder = newOrder;
  if(!db) return;
  try{ await db.doc('otokohonOrder').set({ order: newOrder, ts: Date.now() }); }
  catch(e){ showToast('並び替えの保存に失敗しました'); }
}
// Swaps the staff at `id` with its neighbor one step up (dir -1) or down
// (dir +1) and saves the full order immediately — no separate save step,
// matching how every other change in this app writes as soon as it's made.
// The local update happens first so the row moves instantly even before
// the write round-trips (this sandbox's own verification showed that
// round-trip can lag on a flaky connection; a real one is near-instant).
async function moveStaff(id, dir){
  const ids = orderedStaffList().map(s=>s.id);
  const idx = ids.indexOf(id);
  const next = idx + dir;
  if(idx===-1 || next<0 || next>=ids.length) return;
  [ids[idx], ids[next]] = [ids[next], ids[idx]];
  staffOrder = ids;
  renderApp();
  if(!db) return;
  try{ await db.doc('otokohonOrder').set({ order: ids, ts: Date.now() }); }
  catch(e){ showToast('並び替えの保存に失敗しました'); }
}
// Lets the admin type an exact 1-indexed position instead of tapping ▲▼
// repeatedly — built so a whole month's sales ranking (順位) can be typed
// in staff-by-staff and the gallery/reorder order follows it immediately,
// writing into the exact same otokohonOrder used everywhere else. An
// invalid or no-op entry just re-renders, which snaps the input back to
// the current real position (reorderRowHtml always derives value from the
// live order), so there's nothing to validate beyond "is this a number".
async function setStaffPosition(id, rawValue){
  const ids = orderedStaffList().map(s=>s.id);
  const from = ids.indexOf(id);
  if(from===-1){ renderApp(); return; }
  const parsed = parseInt(String(rawValue).replace(/[^0-9]/g,''), 10);
  if(!Number.isFinite(parsed) || parsed<1){ renderApp(); return; }
  const to = Math.min(ids.length, parsed) - 1;
  if(to===from){ renderApp(); return; }
  ids.splice(from, 1);
  ids.splice(to, 0, id);
  staffOrder = ids;
  renderApp();
  if(!db) return;
  try{ await db.doc('otokohonOrder').set({ order: ids, ts: Date.now() }); }
  catch(e){ showToast('並び替えの保存に失敗しました'); }
}

/* ---------- monthly name-rank import (「9月ナンバー」など) ---------- */

// Inserts `id` (whose stored rank is `rank`) right before the first OTHER
// ranked-and-photographed staff member with an equal-or-larger rank number
// — i.e. in order relative to its ranked peers only. Unranked people (or
// ranked people without a photo yet) are skipped over wherever they
// happen to sit rather than used as a stopping point, since a manual ▲▼
// move can freely scatter them anywhere, including ahead of every ranked
// person; stopping at the first one (instead of skipping past it) would
// wrongly treat "ranked block starts at the front" as a fixed rule. Falls
// back to the very end when no larger-or-equal ranked peer exists.
function insertByNameRank(order, id, rank){
  const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
  const withoutId = order.filter(x=>x!==id);
  let insertAt = withoutId.length;
  for(let i=0;i<withoutId.length;i++){
    const other = byId[withoutId[i]];
    const otherRank = other && nameRankTable[other.name];
    const otherHasPhoto = other && !!staffPhotos[other.id];
    if(other && Number.isFinite(otherRank) && otherHasPhoto && otherRank>=rank){ insertAt = i; break; }
  }
  withoutId.splice(insertAt, 0, id);
  return withoutId;
}

// Explicit, one-shot bulk apply: every staff member who (a) already has a
// 宣材写真 right now and (b) has a name-matched entry in nameRankTable moves
// into a contiguous block at the front, sorted by that rank. Everyone else
// (no entry, or ranked but no photo yet) keeps their existing relative
// order, appended after. Called only when the admin explicitly saves the
// ranking table — ongoing "slot in once the photo appears" is handled one
// person at a time by handleNewlyPhotographedStaff instead, so it never
// re-fights manual reordering done afterward.
function applyNameRankOrderNow(){
  const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
  const current = orderedStaffList().map(s=>s.id);
  const ranked = [], rest = [];
  current.forEach(id=>{
    const s = byId[id];
    const rank = s && nameRankTable[s.name];
    if(s && Number.isFinite(rank) && staffPhotos[id]) ranked.push({ id, rank });
    else rest.push(id);
  });
  ranked.sort((a,b)=>a.rank-b.rank);
  return ranked.map(r=>r.id).concat(rest);
}

// Detects a staff member's 宣材写真 newly appearing (vs the previous
// staffPhotos snapshot) and, if their name matches nameRankTable, slots
// JUST that person into the matching position automatically — "名前が同じ
// やつは写真上がったら勝手にナンバー並び替えになる様にして". Never touches
// anyone else's position, so it can't undo reordering done by hand since.
// The very first snapshot (page load) only records the baseline; staff who
// already had a photo then were already accounted for whenever the table
// was last saved, so inserting them again here would be redundant.
function handleNewlyPhotographedStaff(flat){
  const ids = Object.keys(flat);
  if(knownPhotoStaffIds===null){ knownPhotoStaffIds = new Set(ids); return; }
  const freshlyPhotographed = ids.filter(id=>!knownPhotoStaffIds.has(id));
  knownPhotoStaffIds = new Set(ids);
  if(!freshlyPhotographed.length) return;
  const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
  const matched = freshlyPhotographed
    .map(id=>({ id, s: byId[id], rank: byId[id] && nameRankTable[byId[id].name] }))
    .filter(m=>m.s && Number.isFinite(m.rank))
    .sort((a,b)=>a.rank-b.rank); // process in rank order, in case several appear in the same snapshot
  if(!matched.length) return;
  let order = orderedStaffList().map(s=>s.id);
  matched.forEach(m=>{ order = insertByNameRank(order, m.id, m.rank); });
  staffOrder = order;
  renderApp();
  if(db) db.doc('otokohonOrder').set({ order, ts: Date.now() }).catch(()=>{});
  showToast(matched.map(m=>m.s.name).join('、') + ' をナンバー順に自動配置しました');
}

// Formats the saved table back into pasteable "name␉rank" lines, sorted by
// rank, so re-opening the screen shows the current state for review/editing
// rather than a blank box.
function formatNameRankTable(table){
  return Object.keys(table||{})
    .map(name=>({ name, rank: table[name] }))
    .sort((a,b)=>a.rank-b.rank)
    .map(e=>`${e.name}\t${e.rank}`)
    .join('\n');
}

// Parses pasted lines of "name <tab/comma/spaces> number" — exactly what a
// 2-column copy from Excel/OneDrive pastes as (tab-separated, one row per
// line) — into a {name: rank} map. Blank lines and lines with no trailing
// number are silently skipped rather than rejecting the whole paste.
function parseRankImportText(text){
  const table = {};
  String(text||'').split(/\r?\n/).forEach(line=>{
    const trimmed = line.trim();
    if(!trimmed) return;
    const m = trimmed.match(/^(.*\S)[\t,\s]+(\d+)\s*$/);
    if(m) table[m[1].trim()] = parseInt(m[2], 10);
  });
  return table;
}

function openRankImport(){
  rankImportDraft = null;
  view = 'rankImport';
  renderApp();
}
function backFromRankImport(){
  rankImportDraft = null;
  view = 'reorder';
  renderApp();
}
async function saveRankImport(){
  const ta = document.getElementById('rankImportTextarea');
  const text = ta ? ta.value : (rankImportDraft || '');
  const parsed = parseRankImportText(text);
  const count = Object.keys(parsed).length;
  if(!count){ showToast('「名前　数字」の行が見つかりませんでした'); return; }
  nameRankTable = parsed;
  knownPhotoStaffIds = new Set(Object.keys(staffPhotos)); // these are all "already accounted for" as of this save
  const newOrder = applyNameRankOrderNow();
  staffOrder = newOrder;
  rankImportDraft = null;
  view = 'reorder';
  renderApp();
  if(!db) return;
  try{
    await db.doc('otokohonNameRank').set(parsed);
    await db.doc('otokohonOrder').set({ order: newOrder, ts: Date.now() });
    const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
    const appliedNow = newOrder.filter(id=>{
      const s = byId[id];
      return s && Number.isFinite(parsed[s.name]) && staffPhotos[id];
    }).length;
    showToast(count + '件を保存しました（今すぐ反映: ' + appliedNow + '人。写真が未登録の人は、写真が上がり次第自動で反映されます）');
  }catch(e){ showToast('ナンバーの保存に失敗しました'); }
}

}

// Clears both the uploaded 宣材写真 and whatever's currently selected
// (staffPhoto or one specific clock-in capture), resetting this staff
// member to the same "未設定" placeholder as someone who's never had a
// photo at all. staffPhotos/{id} is the exact same node X8 TIME CHECK's
// own ✕ button clears the same way (set(null) removes the key there too);
// otokohonSelection/{id} also has to go, or a lingering clock-in selection
// would make the old photo reappear the moment a new 宣材写真 is uploaded.
function confirmRemoveStaffPhoto(id){
  const staff = staffList.find(s=>s.id===id);
  if(!staff || !db) return;
  showConfirmModal(staff.name + 'の写真を削除して「未設定」に戻しますか？', ()=>doRemoveStaffPhoto(id));
}
async function doRemoveStaffPhoto(id){
  if(!db) return;
  try{
    await Promise.all([
      db.doc('staffPhotos/' + id).set(null),
      db.doc('otokohonSelection/' + id).set(null),
    ]);
    showToast('写真を削除しました');
  }catch(e){ showToast('削除に失敗しました'); }
}

// Uploads write to staffPhotos/{id} — the SAME node X8 TIME CHECK's own
// 設定 tab manages — so a new 宣材写真 added from either app shows up in
// both, and immediately becomes the active 男本 photo.
function pickPromoPhotoFile(){
  const input = document.getElementById('promoPhotoFileInput');
  if(input) input.click();
}
async function onPromoPhotoFileSelected(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  const staffId = activeStaffId;
  if(!file || !staffId || !db) return;
  showToast('写真をアップロード中…');
  try{
    const dataUrl = await makeCompressedDataUrl(file, STAFF_PHOTO_ATTEMPTS, STAFF_PHOTO_MAX_CHARS);
    if(!dataUrl){ showToast('写真の処理に失敗しました'); return; }
    await db.doc('staffPhotos/' + staffId).set({ dataUrl, ts: Date.now() });
    await db.doc('otokohonSelection/' + staffId).set({ kind:'staffPhoto', ts: Date.now() });
    showToast('写真を登録しました');
  }catch(err){ showToast('写真の保存に失敗しました'); }
}

/* ---------- modal (password + confirm) ---------- */
function showPasswordModal(onSuccess){
  modalState = { kind:'password', error:'', onSuccess };
  renderModal();
}
// Ported from X8 TIME CHECK's own showConfirmModal — same hand-built
// yes/no box (not window.confirm) so it matches the app's dark/gold look.
function showConfirmModal(message, onYes){
  modalState = { kind:'confirm', message, onYes };
  renderModal();
}
function closeModal(){ modalState = null; renderModal(); }
function modalConfirmYes(){
  if(!modalState || modalState.kind!=='confirm') return;
  const cb = modalState.onYes;
  closeModal();
  if(cb) cb();
}
function submitModalPassword(){
  if(!modalState || modalState.kind!=='password') return;
  const inp = document.getElementById('modalPasswordInput');
  const val = inp ? inp.value : '';
  if(val === MANAGEMENT_PASSWORD){
    const cb = modalState.onSuccess;
    closeModal();
    if(cb) cb();
  } else {
    modalState = Object.assign({}, modalState, { error:'パスワードが違います' });
    renderModal();
  }
}
function renderModal(){
  let el = document.getElementById('modalEl');
  if(!modalState){ if(el) el.remove(); return; }
  // Same reasoning as the reorder-rank guard in renderApp(): if the
  // password field already has focus, leave it be instead of rebuilding
  // it out from under a mid-typed password. Nothing shown in this modal
  // depends on the data that triggers a background renderApp() call —
  // showPasswordModal/submitModalPassword/closeModal all call renderModal()
  // directly whenever the modal itself actually has something new to show.
  // (The confirm box has no text field, so it has nothing to protect and
  // is always safe to rebuild.)
  if(modalState.kind==='password' && el && document.activeElement === document.getElementById('modalPasswordInput')){
    return;
  }
  let justCreated = false;
  if(!el){
    el = document.createElement('div'); el.id = 'modalEl'; el.className = 'modal-overlay';
    document.getElementById('app').appendChild(el);
    justCreated = true;
  }
  if(modalState.kind==='confirm'){
    el.innerHTML = `
      <div class="modal-box">
        <div class="modal-message">${escapeHtml(modalState.message)}</div>
        <div class="modal-actions">
          <button class="btn ghost block" data-action="modalCancel">キャンセル</button>
          <button class="btn gold block" data-action="modalConfirmYes">OK</button>
        </div>
      </div>
    `;
  } else {
    el.innerHTML = `
      <div class="modal-box">
        <div class="modal-message">パスワードを入力してください</div>
        <input type="password" inputmode="numeric" autocomplete="off" class="modal-input" id="modalPasswordInput">
        ${modalState.error ? `<div class="modal-error">${escapeHtml(modalState.error)}</div>` : ''}
        <div class="modal-actions">
          <button class="btn ghost block" data-action="modalCancel">キャンセル</button>
          <button class="btn gold block" data-action="modalPasswordSubmit">確認</button>
        </div>
      </div>
    `;
    const inp = document.getElementById('modalPasswordInput');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') submitModalPassword(); });
    }
  }
  if(justCreated) el._openedAt = Date.now();
  // A long-press that unlocks gallery reordering opens this same modal on
  // pointerup — the click event synthesized right after that pointerup can
  // land on this freshly-inserted backdrop and would otherwise close it on
  // the spot. Ignore backdrop clicks for a brief moment after creation.
  el.onclick = (ev)=>{ if(ev.target===el && Date.now()-el._openedAt > 250) closeModal(); };
}

/* ---------- click dispatch ---------- */
function onAppClick(e){
  // Swallows the click that the browser fires right after the pointerup
  // of a recognized long-press (which already acted, via onMainPointerUp) —
  // otherwise that same tap would also open the full-screen viewer.
  if(suppressNextClick){ suppressNextClick = false; return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='openStaffDetail') openStaffDetail(el.dataset.id, el.dataset.return);
  else if(action==='backToGallery') backToGallery();
  else if(action==='requestReorder') requestReorder();
  else if(action==='backFromReorder') backFromReorder();
  else if(action==='finishGalleryReorder') finishGalleryReorder();
  else if(action==='moveStaffUp') moveStaff(el.dataset.id, -1);
  else if(action==='moveStaffDown') moveStaff(el.dataset.id, 1);
  else if(action==='toggleOpsStaff') toggleOpsStaff(el.dataset.id);
  else if(action==='toggleGalleryHidden') toggleGalleryHidden(el.dataset.id);
  else if(action==='openRankImport') openRankImport();
  else if(action==='backFromRankImport') backFromRankImport();
  else if(action==='saveRankImport') saveRankImport();
  else if(action==='requestEditPhoto') requestEditPhoto(el.dataset.id);
  else if(action==='selectStaffPhoto') selectStaffPhotoAsActive(el.dataset.id);
  else if(action==='selectClockinPhoto'){
    const c = candidatePhotos.find(x=>x.eid===el.dataset.eid);
    if(c) selectClockinPhotoAsActive(el.dataset.id, c);
  }
  else if(action==='pickPromoPhotoFile') pickPromoPhotoFile();
  else if(action==='removeStaffPhoto') confirmRemoveStaffPhoto(el.dataset.id);
  else if(action==='modalCancel') closeModal();
  else if(action==='modalPasswordSubmit') submitModalPassword();
  else if(action==='modalConfirmYes') modalConfirmYes();
}

// The reorder screen's rank input (順位) is a text field, not a button, so
// it needs its own delegated handlers rather than onAppClick's data-action
// dispatch. change (fires on blur/commit, not per keystroke) commits the
// new position; Enter blurs so a mobile "done"/"go" key commits too; focus
// selects the existing digits so retyping a whole month's ranking is just
// tap-type-tap-type down the list.
function onAppChange(e){
  const el = e.target.closest('[data-action="setStaffPosition"]');
  if(!el) return;
  setStaffPosition(el.dataset.id, el.value);
}
function onAppKeydown(e){
  if(e.key!=='Enter') return;
  const el = e.target.closest('[data-action="setStaffPosition"]');
  if(el) el.blur();
}
function onAppFocusIn(e){
  const el = e.target.closest('[data-action="setStaffPosition"]');
  if(el && typeof el.select==='function') el.select();
}
// Keeps rankImportDraft in sync with every keystroke (not just on save) so
// that if an unrelated Firebase update forces a re-render while the admin
// is mid-paste, rankImportHtml() can restore exactly what they'd typed
// instead of silently reverting to the last-saved table.
function onAppInput(e){
  if(e.target && e.target.id==='rankImportTextarea') rankImportDraft = e.target.value;
}

/* ---------- render ---------- */
function renderApp(){
  // Don't rebuild the 並び替え screen while the admin has a rank number
  // field focused mid-edit. Attendance/photo snapshots can land at any
  // moment — staff clock in/out all night — and each one calls renderApp();
  // replacing main.innerHTML while someone is mid-keystroke would reset
  // the field to its old value and drop focus, making a typed number
  // look like it does nothing. Whatever triggered this render already
  // updated the underlying state; setStaffPosition() re-renders once the
  // admin commits (blur/Enter), so nothing is lost by waiting.
  const activeEl = document.activeElement;
  if(view==='reorder' && activeEl && activeEl.classList && activeEl.classList.contains('reorder-rank')){
    return;
  }
  const header = document.getElementById('headerInner');
  const main = document.getElementById('main');
  if(view==='detail'){
    const staff = staffList.find(s=>s.id===activeStaffId);
    header.innerHTML = `
      <button class="btn icon-only ghost" data-action="backToGallery">‹</button>
      <div class="header-title-center">${escapeHtml(staff ? staff.name : '')}</div>
      <div class="header-spacer"></div>
    `;
    main.classList.toggle('full-bleed', !pickerOpen);
    main.innerHTML = detailHtml(staff);
  } else if(view==='reorder'){
    main.classList.remove('full-bleed');
    header.innerHTML = `
      <button class="btn icon-only ghost" data-action="backFromReorder">‹</button>
      <div class="header-title-center">並び替え</div>
      <button class="btn icon-only ghost" data-action="openRankImport" title="ナンバー登録">#</button>
    `;
    main.innerHTML = reorderHtml();
  } else if(view==='rankImport'){
    main.classList.remove('full-bleed');
    header.innerHTML = `
      <button class="btn icon-only ghost" data-action="backFromRankImport">‹</button>
      <div class="header-title-center">ナンバー登録</div>
      <div class="header-spacer"></div>
    `;
    main.innerHTML = rankImportHtml();
  } else {
    main.classList.remove('full-bleed');
    header.innerHTML = galleryReorderMode ? `
      <div class="header-title-center">ドラッグして並べ替え</div>
      <button class="btn gold" data-action="finishGalleryReorder" style="flex:0 0 auto; padding:8px 16px;">完了</button>
    ` : `
      <div class="brand">
        <div class="mark">X8</div>
        <div class="titles">
          <div class="sub">Ikemen List</div>
          <div class="page-title"><span class="live-dot"></span>本日${visibleGalleryStaffList().length}名出勤中</div>
        </div>
      </div>
      <button class="btn icon-only ghost" data-action="requestReorder" title="並び替え">⇅</button>
    `;
    main.innerHTML = galleryHtml();
  }
  renderModal();
}

function galleryHtml(){
  if(!staffList.length){
    return `<div class="empty-hint">スタッフが登録されていません<br>（X8 TIME CHECKの設定タブで登録してください）</div>`;
  }
  if(galleryReorderMode){
    reconcileGalleryDragOrder();
    const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
    if(!galleryDragOrder.length){
      return `<div class="empty-hint">只今出勤中のスタッフはいません</div>`;
    }
    return `
      <div class="hint" style="margin-bottom:12px;">写真を長押ししたままドラッグすると順番を変えられます</div>
      <div class="book-grid">${galleryDragOrder.map(id=>byId[id] ? bookCardHtml(byId[id], true) : '').join('')}</div>
    `;
  }
  const list = visibleGalleryStaffList();
  if(!list.length){
    return `<div class="empty-hint">只今出勤中のスタッフはいません<br>出勤すると自動でここに表示されます</div>`;
  }
  return `<div class="book-grid">${list.map(s=>bookCardHtml(s)).join('')}</div>`;
}
// Deliberately photo-only, no name label: this grid (and the full-screen
// viewer one tap deeper) is the customer-facing board, and names were
// dropped from both at the admin's request. The password-gated screens
// behind the ✎ button — the photo editor (detailEditorHtml) and the
// 並び替え screen — still show the name, since the admin genuinely needs
// it there to tell staff apart while managing them.
function bookCardHtml(s, dragMode){
  const photo = resolvedGalleryPhotos[s.id];
  return `
    <button class="book-card${dragMode ? ' drag-mode' : ''}" ${dragMode ? '' : `data-action="openStaffDetail"`} data-id="${escapeHtml(s.id)}">
      ${photo
        ? `<img class="book-photo" src="${photo}" alt="" draggable="false">`
        : `<div class="book-photo placeholder" style="background:${colorFor(s.id)}">${escapeHtml((s.name||'?').slice(0,1))}</div>`}
      <div class="book-live-dot"></div>
    </button>
  `;
}

function detailHtml(staff){
  if(!staff) return `<div class="empty-hint">スタッフが見つかりません</div>`;
  return pickerOpen ? detailEditorHtml(staff) : detailViewerHtml(staff);
}

// Tap a card -> this: the photo fills the screen. Swipe left/right to
// browse the rest of detailNavList() without going back to the grid.
// The small ✎ button is the same password-gated entry into the photo
// editor as before (requestEditPhoto), just relocated now that the big
// "写真を選ぶ・変更する" button would no longer fit this full-bleed layout.
function detailViewerHtml(staff){
  const photo = resolvedGalleryPhotos[staff.id];
  const list = detailNavList();
  const idx = list.findIndex(s=>s.id===staff.id);
  return `
    <div class="viewer">
      ${photo
        ? `<img class="viewer-photo" src="${photo}" alt="" draggable="false">`
        : `<div class="viewer-photo placeholder" style="background:${colorFor(staff.id)}">${escapeHtml((staff.name||'?').slice(0,1))}</div>`}
      ${(list.length>1 && idx!==-1) ? `<div class="viewer-foot"><div class="viewer-count">${idx+1} / ${list.length}</div></div>` : ''}
      <button class="viewer-edit-btn" data-action="requestEditPhoto" data-id="${escapeHtml(staff.id)}" aria-label="写真を選ぶ・変更する">✎</button>
    </div>
  `;
}

function detailEditorHtml(staff){
  const photo = resolvedGalleryPhotos[staff.id];
  return `
    <div class="detail-hero">
      ${photo
        ? `<img class="detail-photo" src="${photo}" alt="">`
        : `<div class="detail-photo placeholder" style="background:${colorFor(staff.id)}">${escapeHtml((staff.name||'?').slice(0,1))}</div>`}
    </div>
    <div class="detail-name">${escapeHtml(staff.name)}</div>
    ${pickerHtml(staff)}
    <div class="hint" style="margin-top:28px;">バージョン ${escapeHtml(BUILD_STAMP)}</div>
  `;
}

function pickerHtml(staff){
  const sel = selection[staff.id];
  const isStaffPhotoActive = !sel || sel.kind==='staffPhoto';
  const promo = staffPhotos[staff.id];
  const hasPhoto = !!resolvedGalleryPhotos[staff.id];
  const hidden = !!galleryHidden[staff.id];
  return `
    <div class="picker">
      <div class="section-title">宣材写真</div>
      <div class="promo-row">
        ${promo ? `
          <button class="promo-tile ${isStaffPhotoActive ? 'active' : ''}" data-action="selectStaffPhoto" data-id="${escapeHtml(staff.id)}">
            <img src="${promo}" alt="">
            ${isStaffPhotoActive ? '<div class="check">✓</div>' : ''}
          </button>
        ` : ''}
        <button class="promo-tile upload-tile" data-action="pickPromoPhotoFile" data-id="${escapeHtml(staff.id)}">
          <div class="upload-plus">＋</div><div class="upload-label">${promo ? '差し替え' : 'アップロード'}</div>
        </button>
      </div>
      ${hasPhoto ? `
        <button class="btn ghost danger block" style="margin-top:10px;" data-action="removeStaffPhoto" data-id="${escapeHtml(staff.id)}">写真を削除して未設定に戻す</button>
      ` : `
        <button class="btn ghost danger block" style="margin-top:10px;" data-action="toggleGalleryHidden" data-id="${escapeHtml(staff.id)}">${hidden ? '✓ IKEMEN LISTから除外中（タップで戻す／写真が付けば自動で戻ります）' : '写真が無いのでIKEMEN LISTから消す'}</button>
      `}

      <div class="section-title">出勤時の写真から選ぶ</div>
      ${candidatesLoading
        ? `<div class="empty-hint">読み込み中…</div>`
        : (candidatePhotos.length
          ? `<div class="clockin-grid">${candidatePhotos.map(c=>clockinTileHtml(staff.id, c, sel)).join('')}</div>`
          : `<div class="empty-hint">最近の出勤時の写真がまだありません</div>`)}
    </div>
  `;
}
function clockinTileHtml(staffId, c, sel){
  const active = !!(sel && sel.kind==='clockin' && sel.eid===c.eid);
  const label = c.monthKey.slice(5,7) + '/' + c.dayKey + ' ' + c.time;
  return `
    <button class="clockin-tile ${active ? 'active' : ''}" data-action="selectClockinPhoto" data-id="${escapeHtml(staffId)}" data-eid="${escapeHtml(c.eid)}">
      <img src="${c.dataUrl}" alt="">
      ${active ? '<div class="check">✓</div>' : ''}
      <div class="clockin-label">${escapeHtml(label)}</div>
    </button>
  `;
}

function reorderHtml(){
  const list = orderedStaffList();
  if(!list.length) return `<div class="empty-hint">スタッフが登録されていません</div>`;
  return `
    <div class="hint" style="margin-bottom:14px;">数字を直接入力すると、その順位に移動します。右上の「#」から売上ナンバーをまとめて登録すると、名前が一致する人は写真が上がり次第、自動でその順位になります。▲▼でも1つずつ動かせます。「運営」ボタンでIKEMEN LISTに出さない人を設定できます。名前をタップすると写真を編集できます（出勤中でなくてもOK）。写真が無いまま出勤した人は、その編集画面から一時的にIKEMEN LISTから消せます（写真が付くと自動で戻ります）。</div>
    <div class="reorder-list">${list.map((s,i)=>reorderRowHtml(s, i, list.length)).join('')}</div>
  `;
}
function reorderRowHtml(s, i, total){
  const photo = resolvedGalleryPhotos[s.id];
  const excluded = !!excludedStaff[s.id];
  const hidden = !!galleryHidden[s.id];
  return `
    <div class="reorder-row${excluded ? ' excluded' : ''}">
      <input class="reorder-rank" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
        value="${i+1}" data-action="setStaffPosition" data-id="${escapeHtml(s.id)}" aria-label="順位">
      <button class="reorder-main" data-action="openStaffDetail" data-id="${escapeHtml(s.id)}" data-return="reorder">
        ${photo
          ? `<img class="reorder-thumb" src="${photo}" alt="">`
          : `<div class="reorder-thumb placeholder" style="background:${colorFor(s.id)}">${escapeHtml((s.name||'?').slice(0,1))}</div>`}
        <div class="reorder-text">
          <div class="reorder-name">${escapeHtml(s.name)}</div>
          ${excluded ? `<div class="reorder-sub">運営（IKEMEN LISTに非表示）</div>` : (hidden ? `<div class="reorder-sub">写真待ちのため非表示中</div>` : '')}
        </div>
      </button>
      <div class="reorder-btns">
        <div class="reorder-btns-row">
          <button class="btn icon-only ghost" data-action="moveStaffUp" data-id="${escapeHtml(s.id)}" ${i===0 ? 'disabled' : ''}>▲</button>
          <button class="btn icon-only ghost" data-action="moveStaffDown" data-id="${escapeHtml(s.id)}" ${i===total-1 ? 'disabled' : ''}>▼</button>
        </div>
        <button class="btn ghost ops-toggle${excluded ? ' active' : ''}" data-action="toggleOpsStaff" data-id="${escapeHtml(s.id)}">${excluded ? '✓運営' : '運営'}</button>
      </div>
    </div>
  `;
}

function rankImportHtml(){
  const text = rankImportDraft!==null ? rankImportDraft : formatNameRankTable(nameRankTable);
  return `
    <div class="rank-import-intro">
      Excelなどで「名前」と「数字」の2列を選んでコピーし、下の欄にそのまま貼り付けて「保存して反映」を押してください（1行に1人分、名前の後に数字）。<br><br>
      例：<br>たろう　1<br>じろう　2<br>さぶろう　3<br><br>
      名前が一致する人は、宣材写真が登録済みなら保存した瞬間に、まだ写真がない人は写真が上がり次第、自動でその順位に並び替わります。
    </div>
    <textarea id="rankImportTextarea" class="rank-textarea" placeholder="たろう　1&#10;じろう　2&#10;さぶろう　3">${escapeHtml(text)}</textarea>
    <button class="btn gold block" style="margin-top:12px;" data-action="saveRankImport">保存して反映</button>
  `;
}

init();
</script>
