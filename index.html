// ---------- gallery drag-to-reorder (long-press to unlock, see onMainPointer*) ----------
function startGalleryReorder(){
  galleryReorderMode = true;
  galleryDragOrder = visibleGalleryStaffList().map(s=>s.id);
  renderApp();
}
function finishGalleryReorder(){
  galleryReorderMode = false;
  gridDrag = null;
  renderApp();
}
// Keeps the working drag order in sync if attendance changes mid-reorder
// (someone clocks in/out while a card is being dragged) without resetting
// whatever the admin has already rearranged.
function reconcileGalleryDragOrder(){
  const liveIds = visibleGalleryStaffList().map(s=>s.id);
  const liveSet = {}; liveIds.forEach(id=>{ liveSet[id] = true; });
  galleryDragOrder = galleryDragOrder.filter(id=>liveSet[id]);
  const existing = {}; galleryDragOrder.forEach(id=>{ existing[id] = true; });
  liveIds.forEach(id=>{ if(!existing[id]) galleryDragOrder.push(id); });
}
// Splices the dragged subset's new relative order back into the full
// roster order, leaving every staff member NOT currently shown in the
// gallery exactly where they already were — dragging only ever reorders
// people relative to each other among who's visible right now.
function applyVisibleReorder(newVisibleIds){
  const full = orderedStaffList().map(s=>s.id);
  const visibleSet = {}; newVisibleIds.forEach(id=>{ visibleSet[id] = true; });
  let vi = 0;
  return full.map(id=> visibleSet[id] ? newVisibleIds[vi++] : id);
}
async function persistGalleryDragOrder(){
  const newOrder = applyVisibleReorder(galleryDragOrder);
  staffOrder = newOrder;
  if(!db) return;
  try{ await db.doc('otokohonOrder').set({ order: newOrder, ts: Date.now() }); }
  catch(e){ showToast('並び替えの保存に失敗しました'); }
}
// Swaps the staff at `id` with its neighbor one step up (dir -1) or down
// (dir +1) and saves the full order immediately — no separate save step,
// matching how every other change in this app writes as soon as it's made.
// The local update happens first so the row moves instantly even before
// the write round-trips (this sandbox's own verification showed that
// round-trip can lag on a flaky connection; a real one is near-instant).
async function moveStaff(id, dir){
  const ids = orderedStaffList().map(s=>s.id);
  const idx = ids.indexOf(id);
  const next = idx + dir;
  if(idx===-1 || next<0 || next>=ids.length) return;
  [ids[idx], ids[next]] = [ids[next], ids[idx]];
  staffOrder = ids;
  renderApp();
  if(!db) return;
  try{ await db.doc('otokohonOrder').set({ order: ids, ts: Date.now() }); }
  catch(e){ showToast('並び替えの保存に失敗しました'); }
}
// Lets the admin type an exact 1-indexed position instead of tapping ▲▼
// repeatedly — built so a whole month's sales ranking (順位) can be typed
// in staff-by-staff and the gallery/reorder order follows it immediately,
// writing into the exact same otokohonOrder used everywhere else. An
// invalid or no-op entry just re-renders, which snaps the input back to
// the current real position (reorderRowHtml always derives value from the
// live order), so there's nothing to validate beyond "is this a number".
async function setStaffPosition(id, rawValue){
  const ids = orderedStaffList().map(s=>s.id);
  const from = ids.indexOf(id);
  if(from===-1){ renderApp(); return; }
  const parsed = parseInt(String(rawValue).replace(/[^0-9]/g,''), 10);
  if(!Number.isFinite(parsed) || parsed<1){ renderApp(); return; }
  const to = Math.min(ids.length, parsed) - 1;
  if(to===from){ renderApp(); return; }
  ids.splice(from, 1);
  ids.splice(to, 0, id);
  staffOrder = ids;
  renderApp();
  if(!db) return;
  try{ await db.doc('otokohonOrder').set({ order: ids, ts: Date.now() }); }
  catch(e){ showToast('並び替えの保存に失敗しました'); }
}

// Marks/unmarks a staff member as 運営 (operations/management, not a
// customer-facing host): once set, visibleGalleryStaffList() excludes them
// even while clocked in with a photo in X8 TIME CHECK. Written to its own
// otokohonExcluded doc, same pattern as otokohonOrder — config/staff and
// X8 TIME CHECK are never touched.
async function toggleOpsStaff(id){
  const next = Object.assign({}, excludedStaff);
  if(next[id]) delete next[id]; else next[id] = true;
  excludedStaff = next;
  renderApp();
  if(!db) return;
  try{ await db.doc('otokohonExcluded').set(next); }
  catch(e){ showToast('運営設定の保存に失敗しました'); }
}

// Manually hides/un-hides a staff member who currently has no photo from
// the gallery (see the galleryHidden comment up top for why this is kept
// separate from 運営/excludedStaff). No confirm step — same as 運営, it's
// instantly reversible by tapping again, and it also clears itself
// automatically once a photo appears (clearGalleryHiddenWherePhotoAppeared).
async function toggleGalleryHidden(id){
  const next = Object.assign({}, galleryHidden);
  if(next[id]) delete next[id]; else next[id] = true;
  galleryHidden = next;
  renderApp();
  if(!db) return;
  try{ await db.doc('otokohonGalleryHidden').set(next); }
  catch(e){ showToast('設定の保存に失敗しました'); }
}

/* ---------- monthly name-rank import (「9月ナンバー」など) ---------- */

// Matches staff names against the pasted ナンバー表 a little more loosely
// than exact string equality: trims stray leading/trailing spaces and
// folds full-width digits/letters/spaces to half-width (Unicode NFKC), so
// a name retyped with an extra space or typed on an IME that slipped in a
// zenkaku character still matches. An un-matched name is otherwise
// invisible: that person just never gets picked up by the automatic
// ナンバー順 placement, with nothing in the UI to explain why (see the
// "ナンバー表に未登録" hint in reorderRowHtml, which surfaces exactly this
// case to the admin instead of leaving it silent).
//
// otokohon-21: a stage name routinely gets written in several different
// scripts across different systems/people (hiragana とむ in one place,
// katakana トム in another, a romanized "TOM"/"tom" somewhere else — the
// exact report that prompted this) — so on top of NFKC, this also folds
// katakana to hiragana for comparison (treating ヴ/ゔ as interchangeable
// with ブ/ぶ, since Japanese has no native "v" sound and a stylized name
// like いぶ/イヴ is written with either one depending on who typed it), and,
// for a name written in plain ASCII letters, converts it from romaji to
// hiragana via a conservative mora-by-mora table — only when the ENTIRE
// name parses cleanly as recognized syllables, so an unrelated word never
// gets guessed into a false match. None of this folds two genuinely
// DIFFERENT names into each other (かなで and みやび, say, still normalize
// to themselves and nothing else) — it only unifies different spellings of
// the same sounds. For anything script-folding still can't bridge (an
// unrelated nickname, not a spelling variant), the ナンバー表 itself
// accepts several aliases for one rank, separated by "/" — expanded into
// independent same-rank entries by expandNameRankAliases at save time
// (see saveRankImport), well before anything reaches Firebase (Realtime
// Database keys can't contain "/"); rebuildNameRankTableNormalized's own
// split below just stays as a harmless defensive no-op on top of that.
function kataToHiraForMatch(s){
  return s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
function foldVuRowForMatch(s){
  return s.replace(/[ヴゔ]/g, m => (m === 'ヴ' ? 'ブ' : 'ぶ')); // ヴ->ブ, ゔ->ぶ
}
// Conservative romaji->hiragana mora table (Hepburn-ish, with common Kunrei
// alternates). Greedy longest-match (3-letter digraphs, then 2-letter mora,
// then 1-letter). A doubled consonant becomes a small っ. A single leftover
// consonant at the very end (e.g. "tom" ending in "m" with no vowel) gets an
// implicit trailing "u" filled in — the most common way an English-spelled
// nickname elides the final Japanese vowel (とむ="tomu"→casually "tom").
// Anything that still doesn't fully resolve returns null: no guessing.
const ROMAJI_MORA3 = {
  kya:'きゃ',kyu:'きゅ',kyo:'きょ', sha:'しゃ',shu:'しゅ',sho:'しょ', sya:'しゃ',syu:'しゅ',syo:'しょ',
  cha:'ちゃ',chu:'ちゅ',cho:'ちょ', tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ', nya:'にゃ',nyu:'にゅ',nyo:'にょ',
  hya:'ひゃ',hyu:'ひゅ',hyo:'ひょ', mya:'みゃ',myu:'みゅ',myo:'みょ', rya:'りゃ',ryu:'りゅ',ryo:'りょ',
  gya:'ぎゃ',gyu:'ぎゅ',gyo:'ぎょ', jya:'じゃ',jyu:'じゅ',jyo:'じょ', bya:'びゃ',byu:'びゅ',byo:'びょ',
  pya:'ぴゃ',pyu:'ぴゅ',pyo:'ぴょ',
};
const ROMAJI_MORA2 = {
  ka:'か',ki:'き',ku:'く',ke:'け',ko:'こ', sa:'さ',shi:'し',si:'し',su:'す',se:'せ',so:'そ',
  ta:'た',chi:'ち',ti:'ち',tsu:'つ',tu:'つ',te:'て',to:'と', na:'な',ni:'に',nu:'ぬ',ne:'ね',no:'の',
  ha:'は',hi:'ひ',fu:'ふ',hu:'ふ',he:'へ',ho:'ほ', ma:'ま',mi:'み',mu:'む',me:'め',mo:'も',
  ya:'や',yu:'ゆ',yo:'よ', ra:'ら',ri:'り',ru:'る',re:'れ',ro:'ろ', wa:'わ',wo:'を',
  ga:'が',gi:'ぎ',gu:'ぐ',ge:'げ',go:'ご', za:'ざ',ji:'じ',zi:'じ',zu:'ず',ze:'ぜ',zo:'ぞ',
  da:'だ',di:'ぢ',du:'づ',de:'で',do:'ど', ba:'ば',bi:'び',bu:'ぶ',be:'べ',bo:'ぼ',
  pa:'ぱ',pi:'ぴ',pu:'ぷ',pe:'ぺ',po:'ぽ',
};
const ROMAJI_MORA1 = { a:'あ',i:'い',u:'う',e:'え',o:'お' };
function romajiToHiraOrNull(lower){
  if(!/^[a-z]+$/.test(lower)) return null;
  let i = 0, out = '';
  const n = lower.length;
  while(i < n){
    if(i+1 < n && lower[i]===lower[i+1] && !'aeioun'.includes(lower[i])){ out += 'っ'; i += 1; continue; }
    const three = lower.slice(i, i+3), two = lower.slice(i, i+2), one = lower.slice(i, i+1);
    if(ROMAJI_MORA3[three]){ out += ROMAJI_MORA3[three]; i += 3; continue; }
    if(ROMAJI_MORA2[two]){ out += ROMAJI_MORA2[two]; i += 2; continue; }
    if(one === 'n'){ out += 'ん'; i += 1; continue; }
    if(ROMAJI_MORA1[one]){ out += ROMAJI_MORA1[one]; i += 1; continue; }
    if(i === n-1 && 'bcdfgkmprstz'.includes(one) && ROMAJI_MORA2[one+'u']){ out += ROMAJI_MORA2[one+'u']; i += 1; continue; }
    return null;
  }
  return out;
}
function normalizeNameForMatch(name){
  let s = String(name||'').normalize('NFKC').trim().replace(/\s+/g, ' ');
  s = foldVuRowForMatch(kataToHiraForMatch(s));
  if(/^[a-zA-Z]+$/.test(s)){
    const conv = romajiToHiraOrNull(s.toLowerCase());
    if(conv) s = conv;
  }
  return s;
}
let nameRankTableNormalized = {}; // normalized-name -> rank, rebuilt whenever nameRankTable changes
function rebuildNameRankTableNormalized(){
  const next = {};
  // Each ナンバー表 line's name field may itself list several aliases for
  // the same person separated by "/" (e.g. "とむ/トム/TOM/tom\t1") — register
  // all of them against the same rank. Script-folding above already unifies
  // that exact example on its own; the "/" list is for anything it can't
  // reach, like a genuinely different nickname.
  Object.keys(nameRankTable||{}).forEach(nameOrAliases=>{
    String(nameOrAliases).split('/').forEach(alias=>{
      const norm = normalizeNameForMatch(alias);
      if(norm) next[norm] = nameRankTable[nameOrAliases];
    });
  });
  nameRankTableNormalized = next;
}
function rankForStaffName(name){
  return nameRankTableNormalized[normalizeNameForMatch(name)];
}

// Inserts `id` (whose stored rank is `rank`) right before the first OTHER
// ranked-and-photographed staff member with an equal-or-larger rank number
// — i.e. in order relative to its ranked peers only. Unranked people (or
// ranked people without a photo yet) are skipped over wherever they
// happen to sit rather than used as a stopping point, since a manual ▲▼
// move can freely scatter them anywhere, including ahead of every ranked
// person; stopping at the first one (instead of skipping past it) would
// wrongly treat "ranked block starts at the front" as a fixed rule. Falls
// back to the very end when no larger-or-equal ranked peer exists.
function insertByNameRank(order, id, rank){
  const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
  const withoutId = order.filter(x=>x!==id);
  let insertAt = withoutId.length;
  for(let i=0;i<withoutId.length;i++){
    const other = byId[withoutId[i]];
    const otherRank = other && rankForStaffName(other.name);
    const otherHasPhoto = other && !!staffPhotos[other.id];
    if(other && Number.isFinite(otherRank) && otherHasPhoto && otherRank>=rank){ insertAt = i; break; }
  }
  withoutId.splice(insertAt, 0, id);
  return withoutId;
}

// Explicit, one-shot bulk apply: every staff member who (a) already has a
// 宣材写真 right now and (b) has a name-matched entry in nameRankTable moves
// into a contiguous block at the front, sorted by that rank. Everyone else
// (no entry, or ranked but no photo yet) keeps their existing relative
// order, appended after. Called only when the admin explicitly saves the
// ranking table — ongoing "slot in once the photo appears" is handled one
// person at a time by applyRankToNewlyEligibleStaff instead, so it never
// re-fights manual reordering done afterward.
function applyNameRankOrderNow(){
  const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
  const current = orderedStaffList().map(s=>s.id);
  const ranked = [], rest = [];
  current.forEach(id=>{
    const s = byId[id];
    const rank = s && rankForStaffName(s.name);
    if(s && Number.isFinite(rank) && staffPhotos[id]) ranked.push({ id, rank });
    else rest.push(id);
  });
  ranked.sort((a,b)=>a.rank-b.rank);
  return ranked.map(r=>r.id).concat(rest);
}

// Slots any staff member who currently has BOTH a 宣材写真 AND a
// name-matched rank in nameRankTable into that rank position, exactly once
// each — "名前が同じやつは写真上がったら勝手にナンバー並び替えになる様にし
// て". Never touches anyone else's position, so it can't undo a manual
// reorder done by hand since.
//
// "Already placed" (rankApplied) is saved to Firebase rather than kept only
// in this tab's memory. That matters because the 宣材写真 itself is
// uploaded from X8 TIME CHECK, often on a different device — if nobody
// happened to have 男本 open at that exact moment, there was no tab around
// to notice the photo "newly" appearing, and whichever tab opened next
// could no longer tell "always had this photo" apart from "just got it", so
// the person was silently skipped forever ("追記で写真入っても売上順に更新
// する様にして"). Tracking "applied" as a persisted fact instead of a
// same-session diff fixes that: this function is safe to call on every
// staffPhotos/nameRankTable/otokohonRankApplied update, including the very
// first one after load, with no "first snapshot is just a baseline" special
// case needed any more — whoever opens the app next simply catches up
// anyone eligible that nobody got to yet.
function applyRankToNewlyEligibleStaff(){
  if(rankApplied===null) return; // otokohonRankApplied hasn't loaded yet; its own first snapshot re-runs this
  const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
  const eligible = Object.keys(staffPhotos)
    .filter(id=>byId[id] && !rankApplied[id])
    .map(id=>({ id, s: byId[id], rank: rankForStaffName(byId[id].name) }))
    .filter(m=>Number.isFinite(m.rank))
    .sort((a,b)=>a.rank-b.rank); // process in rank order, in case several are caught up at once
  if(!eligible.length) return;
  let order = orderedStaffList().map(s=>s.id);
  eligible.forEach(m=>{ order = insertByNameRank(order, m.id, m.rank); });
  staffOrder = order;
  const patch = {};
  eligible.forEach(m=>{ patch[m.id] = true; });
  rankApplied = Object.assign({}, rankApplied, patch);
  renderApp();
  if(db){
    db.doc('otokohonOrder').set({ order, ts: Date.now() }).catch(()=>{});
    db.doc('otokohonRankApplied').update(patch).catch(()=>{});
  }
  showToast(eligible.map(m=>m.s.name).join('、') + ' をナンバー順に自動配置しました');
}

// Formats the saved table back into pasteable "name␉rank" lines, sorted by
// rank, so re-opening the screen shows the current state for review/editing
// rather than a blank box.
function formatNameRankTable(table){
  return Object.keys(table||{})
    .map(name=>({ name, rank: table[name] }))
    .sort((a,b)=>a.rank-b.rank)
    .map(e=>`${e.name}\t${e.rank}`)
    .join('\n');
}

// Parses pasted lines of "name <tab/comma/spaces> number" — exactly what a
// 2-column copy from Excel/OneDrive pastes as (tab-separated, one row per
// line) — into a {name: rank} map. Blank lines and lines with no trailing
// number are silently skipped rather than rejecting the whole paste.
function parseRankImportText(text){
  const table = {};
  String(text||'').split(/\r?\n/).forEach(line=>{
    const trimmed = line.trim();
    if(!trimmed) return;
    const m = trimmed.match(/^(.*\S)[\t,\s]+(\d+)\s*$/);
    if(m) table[m[1].trim()] = parseInt(m[2], 10);
  });
  return table;
}

// otokohon-21: an explicit "/"-combined alias line (e.g. "くまこ/ちび\t4")
// must NEVER reach nameRankTable — and therefore Firebase — with its "/"
// still literally inside one object key. Realtime Database forbids ".",
// "#", "$", "/", "[", and "]" in a key (it's reserved as a path
// separator there), and db.doc(...).set() throws synchronously the
// instant it sees one — confirmed directly against this project's own
// RTDB: "set failed: ... contains an invalid key (くまこ/ちび)" — which
// silently fails to save the WHOLE table, not just the alias line, since
// the entire parsed object is written in one set() call. So every
// "/"-separated alias is split out into its OWN independent {alias:
// rank} entry right here, immediately after parsing and before anything
// is assigned to nameRankTable or reaches Firebase — the saved table
// itself ends up perfectly flat, with every key already a plain single
// name. (rebuildNameRankTableNormalized's own "/"-split further down
// still runs on top of this and stays harmless: splitting an
// already-slash-free string by "/" is just a no-op, so it remains a
// defensive second layer rather than the thing actually protecting
// Firebase.) The one visible trade-off: reopening ナンバー登録 after
// saving an alias line shows it as two separate same-rank lines rather
// than the original combined "a/b" text — functionally identical, just
// no longer visually grouped as one line.
function expandNameRankAliases(table){
  const out = {};
  Object.keys(table||{}).forEach(nameOrAliases=>{
    String(nameOrAliases).split('/').forEach(alias=>{
      const trimmed = alias.trim();
      if(trimmed) out[trimmed] = table[nameOrAliases];
    });
  });
  return out;
}

function openRankImport(){
  rankImportDraft = null;
  view = 'rankImport';
  renderApp();
}
function backFromRankImport(){
  rankImportDraft = null;
  view = 'reorder';
  renderApp();
}
async function saveRankImport(){
  const ta = document.getElementById('rankImportTextarea');
  const text = ta ? ta.value : (rankImportDraft || '');
  const parsed = expandNameRankAliases(parseRankImportText(text));
  const count = Object.keys(parsed).length;
  if(!count){ showToast('「名前　数字」の行が見つかりませんでした'); return; }
  nameRankTable = parsed;
  rebuildNameRankTableNormalized();
  // Everyone who already has a photo right now is "already accounted for"
  // as of this save — applyNameRankOrderNow() just placed them (or, if
  // unranked, deliberately left them where they were) — so mark them
  // applied here too, same as the order write below, so
  // applyRankToNewlyEligibleStaff doesn't redo this for them later. Anyone
  // without a photo yet stays un-applied, ready to be picked up
  // automatically whenever their 宣材写真 eventually appears.
  const accountedFor = {};
  Object.keys(staffPhotos).forEach(id=>{ accountedFor[id] = true; });
  rankApplied = Object.assign({}, rankApplied, accountedFor);
  const newOrder = applyNameRankOrderNow();
  staffOrder = newOrder;
  rankImportDraft = null;
  view = 'reorder';
  renderApp();
  if(!db) return;
  try{
    await db.doc('otokohonNameRank').set(parsed);
    await db.doc('otokohonOrder').set({ order: newOrder, ts: Date.now() });
    await db.doc('otokohonRankApplied').update(accountedFor);
    const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
    const appliedNow = newOrder.filter(id=>{
      const s = byId[id];
      return s && Number.isFinite(parsed[s.name]) && staffPhotos[id];
    }).length;
    showToast(count + '件を保存しました（今すぐ反映: ' + appliedNow + '人。写真が未登録の人は、写真が上がり次第自動で反映されます）');
  }catch(e){ showToast('ナンバーの保存に失敗しました'); }
}

// Password is asked every time, never cached for the session — matches
// how ログ/設定 work in X8 TIME CHECK.
function requestEditPhoto(id){
  showPasswordModal(()=>{
    pickerOpen = true;
    renderApp();
    loadClockinCandidates(id);
  });
}

async function selectStaffPhotoAsActive(staffId){
  if(!db){ showToast('データ保存を利用できません'); return; }
  try{
    await db.doc('otokohonSelection/' + staffId).set({ kind:'staffPhoto', ts: Date.now() });
    showToast('写真を変更しました');
  }catch(e){ showToast('変更に失敗しました'); }
}
async function selectClockinPhotoAsActive(staffId, cand){
  if(!db){ showToast('データ保存を利用できません'); return; }
  try{
    await db.doc('otokohonSelection/' + staffId).set({
      kind:'clockin', monthKey: cand.monthKey, dayKey: cand.dayKey, eid: cand.eid, photo: cand.photo, ts: Date.now()
    });
    showToast('写真を変更しました');
  }catch(e){ showToast('変更に失敗しました'); }
}

// Clears both the uploaded 宣材写真 and whatever's currently selected
// (staffPhoto or one specific clock-in capture), resetting this staff
// member to the same "未設定" placeholder as someone who's never had a
// photo at all. staffPhotos/{id} is the exact same node X8 TIME CHECK's
// own ✕ button clears the same way (set(null) removes the key there too);
// otokohonSelection/{id} also has to go, or a lingering clock-in selection
// would make the old photo reappear the moment a new 宣材写真 is uploaded.
function confirmRemoveStaffPhoto(id){
  const staff = staffList.find(s=>s.id===id);
  if(!staff || !db) return;
  showConfirmModal(staff.name + 'の写真を削除して「未設定」に戻しますか？', ()=>doRemoveStaffPhoto(id));
}
async function doRemoveStaffPhoto(id){
  if(!db) return;
  try{
    await Promise.all([
      db.doc('staffPhotos/' + id).set(null),
      db.doc('otokohonSelection/' + id).set(null),
      // So a later re-upload is treated as a fresh appearance again, exactly
      // like before this photo ever existed, instead of being silently
      // skipped as "already applied".
      db.doc('otokohonRankApplied/' + id).set(null),
    ]);
    showToast('写真を削除しました');
  }catch(e){ showToast('削除に失敗しました'); }
}

// Uploads write to staffPhotos/{id} — the SAME node X8 TIME CHECK's own
// 設定 tab manages — so a new 宣材写真 added from either app shows up in
// both, and immediately becomes the active 男本 photo.
function pickPromoPhotoFile(){
  const input = document.getElementById('promoPhotoFileInput');
  if(input) input.click();
}
async function onPromoPhotoFileSelected(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  const staffId = activeStaffId;
  if(!file || !staffId || !db) return;
  showToast('写真をアップロード中…');
  try{
    const dataUrl = await makeCompressedDataUrl(file, STAFF_PHOTO_ATTEMPTS, STAFF_PHOTO_MAX_CHARS);
    if(!dataUrl){ showToast('写真の処理に失敗しました'); return; }
    await db.doc('staffPhotos/' + staffId).set({ dataUrl, ts: Date.now() });
    await db.doc('otokohonSelection/' + staffId).set({ kind:'staffPhoto', ts: Date.now() });
    showToast('写真を登録しました');
  }catch(err){ showToast('写真の保存に失敗しました'); }
}

/* ---------- modal (password + confirm) ---------- */
function showPasswordModal(onSuccess){
  modalState = { kind:'password', error:'', onSuccess };
  renderModal();
}
// Ported from X8 TIME CHECK's own showConfirmModal — same hand-built
// yes/no box (not window.confirm) so it matches the app's dark/gold look.
function showConfirmModal(message, onYes){
  modalState = { kind:'confirm', message, onYes };
  renderModal();
}
function closeModal(){ modalState = null; renderModal(); }
function modalConfirmYes(){
  if(!modalState || modalState.kind!=='confirm') return;
  const cb = modalState.onYes;
  closeModal();
  if(cb) cb();
}
function submitModalPassword(){
  if(!modalState || modalState.kind!=='password') return;
  const inp = document.getElementById('modalPasswordInput');
  const val = inp ? inp.value : '';
  if(val === MANAGEMENT_PASSWORD){
    const cb = modalState.onSuccess;
    closeModal();
    if(cb) cb();
  } else {
    modalState = Object.assign({}, modalState, { error:'パスワードが違います' });
    renderModal();
  }
}
function renderModal(){
  let el = document.getElementById('modalEl');
  if(!modalState){ if(el) el.remove(); return; }
  // Same reasoning as the reorder-rank guard in renderApp(): if the
  // password field already has focus, leave it be instead of rebuilding
  // it out from under a mid-typed password. Nothing shown in this modal
  // depends on the data that triggers a background renderApp() call —
  // showPasswordModal/submitModalPassword/closeModal all call renderModal()
  // directly whenever the modal itself actually has something new to show.
  // (The confirm box has no text field, so it has nothing to protect and
  // is always safe to rebuild.)
  if(modalState.kind==='password' && el && document.activeElement === document.getElementById('modalPasswordInput')){
    return;
  }
  let justCreated = false;
  if(!el){
    el = document.createElement('div'); el.id = 'modalEl'; el.className = 'modal-overlay';
    document.getElementById('app').appendChild(el);
    justCreated = true;
  }
  if(modalState.kind==='confirm'){
    el.innerHTML = `
      <div class="modal-box">
        <div class="modal-message">${escapeHtml(modalState.message)}</div>
        <div class="modal-actions">
          <button class="btn ghost block" data-action="modalCancel">キャンセル</button>
          <button class="btn gold block" data-action="modalConfirmYes">OK</button>
        </div>
      </div>
    `;
  } else {
    el.innerHTML = `
      <div class="modal-box">
        <div class="modal-message">パスワードを入力してください</div>
        <input type="password" inputmode="numeric" autocomplete="off" class="modal-input" id="modalPasswordInput">
        ${modalState.error ? `<div class="modal-error">${escapeHtml(modalState.error)}</div>` : ''}
        <div class="modal-actions">
          <button class="btn ghost block" data-action="modalCancel">キャンセル</button>
          <button class="btn gold block" data-action="modalPasswordSubmit">確認</button>
        </div>
      </div>
    `;
    const inp = document.getElementById('modalPasswordInput');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') submitModalPassword(); });
    }
  }
  if(justCreated) el._openedAt = Date.now();
  // A long-press that unlocks gallery reordering opens this same modal on
  // pointerup — the click event synthesized right after that pointerup can
  // land on this freshly-inserted backdrop and would otherwise close it on
  // the spot. Ignore backdrop clicks for a brief moment after creation.
  el.onclick = (ev)=>{ if(ev.target===el && Date.now()-el._openedAt > 250) closeModal(); };
}

/* ---------- click dispatch ---------- */
function onAppClick(e){
  // Swallows the click that the browser fires right after the pointerup
  // of a recognized long-press (which already acted, via onMainPointerUp) —
  // otherwise that same tap would also open the full-screen viewer.
  if(suppressNextClick){ suppressNextClick = false; return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='openStaffDetail') openStaffDetail(el.dataset.id, el.dataset.return);
  else if(action==='backToGallery') backToGallery();
  else if(action==='requestReorder') requestReorder();
  else if(action==='backFromReorder') backFromReorder();
  else if(action==='finishGalleryReorder') finishGalleryReorder();
  else if(action==='moveStaffUp') moveStaff(el.dataset.id, -1);
  else if(action==='moveStaffDown') moveStaff(el.dataset.id, 1);
  else if(action==='toggleOpsStaff') toggleOpsStaff(el.dataset.id);
  else if(action==='toggleGalleryHidden') toggleGalleryHidden(el.dataset.id);
  else if(action==='openRankImport') openRankImport();
  else if(action==='backFromRankImport') backFromRankImport();
  else if(action==='saveRankImport') saveRankImport();
  else if(action==='requestEditPhoto') requestEditPhoto(el.dataset.id);
  else if(action==='selectStaffPhoto') selectStaffPhotoAsActive(el.dataset.id);
  else if(action==='selectClockinPhoto'){
    const c = candidatePhotos.find(x=>x.eid===el.dataset.eid);
    if(c) selectClockinPhotoAsActive(el.dataset.id, c);
  }
  else if(action==='pickPromoPhotoFile') pickPromoPhotoFile();
  else if(action==='removeStaffPhoto') confirmRemoveStaffPhoto(el.dataset.id);
  else if(action==='modalCancel') closeModal();
  else if(action==='modalPasswordSubmit') submitModalPassword();
  else if(action==='modalConfirmYes') modalConfirmYes();
}

// The reorder screen's rank input (順位) is a text field, not a button, so
// it needs its own delegated handlers rather than onAppClick's data-action
// dispatch. change (fires on blur/commit, not per keystroke) commits the
// new position; Enter blurs so a mobile "done"/"go" key commits too; focus
// selects the existing digits so retyping a whole month's ranking is just
// tap-type-tap-type down the list.
function onAppChange(e){
  const el = e.target.closest('[data-action="setStaffPosition"]');
  if(!el) return;
  setStaffPosition(el.dataset.id, el.value);
}
function onAppKeydown(e){
  if(e.key!=='Enter') return;
  const el = e.target.closest('[data-action="setStaffPosition"]');
  if(el) el.blur();
}
function onAppFocusIn(e){
  const el = e.target.closest('[data-action="setStaffPosition"]');
  if(el && typeof el.select==='function') el.select();
}
// Keeps rankImportDraft in sync with every keystroke (not just on save) so
// that if an unrelated Firebase update forces a re-render while the admin
// is mid-paste, rankImportHtml() can restore exactly what they'd typed
// instead of silently reverting to the last-saved table.
function onAppInput(e){
  if(e.target && e.target.id==='rankImportTextarea') rankImportDraft = e.target.value;
}

/* ---------- render ---------- */
function renderApp(){
  // Don't rebuild the 並び替え screen while the admin has a rank number
  // field focused mid-edit. Attendance/photo snapshots can land at any
  // moment — staff clock in/out all night — and each one calls renderApp();
  // replacing main.innerHTML while someone is mid-keystroke would reset
  // the field to its old value and drop focus, making a typed number
  // look like it does nothing. Whatever triggered this render already
  // updated the underlying state; setStaffPosition() re-renders once the
  // admin commits (blur/Enter), so nothing is lost by waiting.
  const activeEl = document.activeElement;
  if(view==='reorder' && activeEl && activeEl.classList && activeEl.classList.contains('reorder-rank')){
    return;
  }
  const header = document.getElementById('headerInner');
  const main = document.getElementById('main');
  if(view==='detail'){
    const item = findDetailItem(activeStaffId);
    header.innerHTML = `
      <button class="btn icon-only ghost" data-action="backToGallery">‹</button>
      <div class="header-title-center">${escapeHtml(item && !item.isLead ? item.name : '')}</div>
      <div class="header-spacer"></div>
    `;
    main.classList.toggle('full-bleed', !pickerOpen);
    main.innerHTML = detailHtml(item);
  } else if(view==='reorder'){
    main.classList.remove('full-bleed');
    header.innerHTML = `
      <button class="btn icon-only ghost" data-action="backFromReorder">‹</button>
      <div class="header-title-center">並び替え</div>
      <button class="btn icon-only ghost" data-action="openRankImport" title="ナンバー登録">#</button>
    `;
    main.innerHTML = reorderHtml();
  } else if(view==='rankImport'){
    main.classList.remove('full-bleed');
    header.innerHTML = `
      <button class="btn icon-only ghost" data-action="backFromRankImport">‹</button>
      <div class="header-title-center">ナンバー登録</div>
      <div class="header-spacer"></div>
    `;
    main.innerHTML = rankImportHtml();
  } else {
    main.classList.remove('full-bleed');
    header.innerHTML = galleryReorderMode ? `
      <div class="header-title-center">ドラッグして並べ替え</div>
      <button class="btn gold" data-action="finishGalleryReorder" style="flex:0 0 auto; padding:8px 16px;">完了</button>
    ` : `
      <div class="brand">
        <div class="mark">X8</div>
        <div class="titles">
          <div class="sub">Ikemen List</div>
          <div class="page-title"><span class="live-dot${rtdbConnected ? '' : ' offline'}"></span>本日${visibleGalleryStaffList().length}名出勤中${rtdbConnected ? '' : '（再接続中…）'}</div>
        </div>
      </div>
      <button class="btn icon-only ghost" data-action="requestReorder" title="並び替え">⇅</button>
    `;
    main.innerHTML = galleryHtml();
  }
  renderModal();
}

function galleryHtml(){
  // LEAD_SLIDES (QR code for the 初回誓約書, then the two menu pages) lead
  // every render of the live gallery, unconditionally — even with no
  // staff registered at all or nobody currently clocked in — since
  // they're venue-level info, not tied to who's working right now.
  const leadHtml = LEAD_SLIDES.map(leadCardHtml).join('');
  if(!staffList.length){
    return `<div class="book-grid">${leadHtml}<div class="empty-hint book-grid-span">スタッフが登録されていません<br>（X8 TIME CHECKの設定タブで登録してください）</div></div>`;
  }
  if(galleryReorderMode){
    // Drag-to-reorder is for rearranging STAFF cards only — the lead
    // slides have a fixed, always-first position by design, so they're
    // deliberately left out of this grid rather than shown non-draggable.
    reconcileGalleryDragOrder();
    const byId = {}; staffList.forEach(s=>{ byId[s.id] = s; });
    if(!galleryDragOrder.length){
      return `<div class="empty-hint">只今出勤中のスタッフはいません</div>`;
    }
    return `
      <div class="hint" style="margin-bottom:12px;">写真を長押ししたままドラッグすると順番を変えられます</div>
      <div class="book-grid">${galleryDragOrder.map(id=>byId[id] ? bookCardHtml(byId[id], true) : '').join('')}</div>
    `;
  }
  const list = visibleGalleryStaffList();
  const staffHtml = list.length
    ? list.map(s=>bookCardHtml(s)).join('')
    : `<div class="empty-hint book-grid-span">只今出勤中のスタッフはいません<br>出勤すると自動でここに表示されます</div>`;
  return `<div class="book-grid">${leadHtml}${staffHtml}</div>`;
}
// Deliberately photo-only, no name label: this grid (and the full-screen
// viewer one tap deeper) is the customer-facing board, and names were
// dropped from both at the admin's request. The password-gated screens
// behind the ✎ button — the photo editor (detailEditorHtml) and the
// 並び替え screen — still show the name, since the admin genuinely needs
// it there to tell staff apart while managing them.
function bookCardHtml(s, dragMode){
  const photo = resolvedGalleryPhotos[s.id];
  return `
    <button class="book-card${dragMode ? ' drag-mode' : ''}" ${dragMode ? '' : `data-action="openStaffDetail"`} data-id="${escapeHtml(s.id)}">
      ${photo
        ? `<img class="book-photo" src="${photo}" alt="" draggable="false">`
        : `<div class="book-photo placeholder" style="background:${colorFor(s.id)}">${escapeHtml((s.name||'?').slice(0,1))}</div>`}
      <div class="book-live-dot"></div>
    </button>
  `;
}
// The QR/menu lead cards: same card chrome as a staff photo, but
// object-fit:contain (the .contain class — see CSS) instead of cover, so
// the whole image always stays on screen un-cropped (a QR code cropped to
// fill a 3:4 tile could lose its corner finder patterns).
function leadCardHtml(slide){
  return `
    <button class="book-card" data-action="openStaffDetail" data-id="${escapeHtml(slide.id)}">
      <img class="book-photo contain" src="${slide.src}" alt="${escapeHtml(slide.alt||'')}" draggable="false">
    </button>
  `;
}

function detailHtml(item){
  if(!item) return `<div class="empty-hint">見つかりません</div>`;
  if(item.isLead) return leadSlideViewerHtml(item); // fixed slides: no editor, just the swipeable viewer
  return pickerOpen ? detailEditorHtml(item) : detailViewerHtml(item);
}

// Same full-screen "tap to fill the screen, swipe to browse" chrome as
// detailViewerHtml below, minus the ✎ edit button — there's no Firebase
// data behind a lead slide to edit; updating one of these means shipping
// a new build, same as any other fixed app content. object-fit:contain
// (via the .contain class, see CSS) keeps the WHOLE image on screen
// un-cropped, unlike a staff portrait's deliberate object-fit:cover —
// critical here since one of these is a QR code a customer needs to
// actually scan, and cropping could cut into its finder patterns.
function leadSlideViewerHtml(slide){
  const list = detailNavList();
  const idx = list.findIndex(x=>x.id===slide.id);
  return `
    <div class="viewer">
      <img class="viewer-photo contain" src="${slide.src}" alt="${escapeHtml(slide.alt||'')}" draggable="false">
      ${(list.length>1 && idx!==-1) ? `<div class="viewer-foot"><div class="viewer-count">${idx+1} / ${list.length}</div></div>` : ''}
    </div>
  `;
}

// Tap a card -> this: the photo fills the screen. Swipe left/right to
// browse the rest of detailNavList() without going back to the grid.
// The small ✎ button is the same password-gated entry into the photo
// editor as before (requestEditPhoto), just relocated now that the big
// "写真を選ぶ・変更する" button would no longer fit this full-bleed layout.
function detailViewerHtml(staff){
  const photo = resolvedGalleryPhotos[staff.id];
  const list = detailNavList();
  const idx = list.findIndex(s=>s.id===staff.id);
  return `
    <div class="viewer">
      ${photo
        ? `<img class="viewer-photo" src="${photo}" alt="" draggable="false">`
        : `<div class="viewer-photo placeholder" style="background:${colorFor(staff.id)}">${escapeHtml((staff.name||'?').slice(0,1))}</div>`}
      ${(list.length>1 && idx!==-1) ? `<div class="viewer-foot"><div class="viewer-count">${idx+1} / ${list.length}</div></div>` : ''}
      <button class="viewer-edit-btn" data-action="requestEditPhoto" data-id="${escapeHtml(staff.id)}" aria-label="写真を選ぶ・変更する">✎</button>
    </div>
  `;
}

function detailEditorHtml(staff){
  const photo = resolvedGalleryPhotos[staff.id];
  return `
    <div class="detail-hero">
      ${photo
        ? `<img class="detail-photo" src="${photo}" alt="">`
        : `<div class="detail-photo placeholder" style="background:${colorFor(staff.id)}">${escapeHtml((staff.name||'?').slice(0,1))}</div>`}
    </div>
    <div class="detail-name">${escapeHtml(staff.name)}</div>
    ${pickerHtml(staff)}
    <div class="hint" style="margin-top:28px;">バージョン ${escapeHtml(BUILD_STAMP)}</div>
  `;
}

function pickerHtml(staff){
  const sel = selection[staff.id];
  const isStaffPhotoActive = isPromoPhotoActive(staff.id);
  const promo = staffPhotos[staff.id];
  const hasPhoto = !!resolvedGalleryPhotos[staff.id];
  const hidden = !!galleryHidden[staff.id];
  return `
    <div class="picker">
      <div class="section-title">宣材写真</div>
      <div class="promo-row">
        ${promo ? `
          <button class="promo-tile ${isStaffPhotoActive ? 'active' : ''}" data-action="selectStaffPhoto" data-id="${escapeHtml(staff.id)}">
            <img src="${promo}" alt="">
            ${isStaffPhotoActive ? '<div class="check">✓</div>' : ''}
          </button>
        ` : ''}
        <button class="promo-tile upload-tile" data-action="pickPromoPhotoFile" data-id="${escapeHtml(staff.id)}">
          <div class="upload-plus">＋</div><div class="upload-label">${promo ? '差し替え' : 'アップロード'}</div>
        </button>
      </div>
      ${hasPhoto ? `
        <button class="btn ghost danger block" style="margin-top:10px;" data-action="removeStaffPhoto" data-id="${escapeHtml(staff.id)}">写真を削除して未設定に戻す</button>
      ` : `
        <button class="btn ghost danger block" style="margin-top:10px;" data-action="toggleGalleryHidden" data-id="${escapeHtml(staff.id)}">${hidden ? '✓ IKEMEN LISTから除外中（タップで戻す／写真が付けば自動で戻ります）' : '写真が無いのでIKEMEN LISTから消す'}</button>
      `}

      <div class="section-title">出勤時の写真から選ぶ</div>
      ${candidatesLoading
        ? `<div class="empty-hint">読み込み中…</div>`
        : (candidatePhotos.length
          ? `<div class="clockin-grid">${candidatePhotos.map(c=>clockinTileHtml(staff.id, c, sel, isStaffPhotoActive)).join('')}</div>`
          : `<div class="empty-hint">最近の出勤時の写真がまだありません</div>`)}
    </div>
  `;
}
function clockinTileHtml(staffId, c, sel, promoActive){
  const active = !promoActive && !!(sel && sel.kind==='clockin' && sel.eid===c.eid);
  const label = c.monthKey.slice(5,7) + '/' + c.dayKey + ' ' + c.time;
  return `
    <button class="clockin-tile ${active ? 'active' : ''}" data-action="selectClockinPhoto" data-id="${escapeHtml(staffId)}" data-eid="${escapeHtml(c.eid)}">
      <img src="${c.dataUrl}" alt="">
      ${active ? '<div class="check">✓</div>' : ''}
      <div class="clockin-label">${escapeHtml(label)}</div>
    </button>
  `;
}

function reorderHtml(){
  const list = orderedStaffList();
  if(!list.length) return `<div class="empty-hint">スタッフが登録されていません</div>`;
  return `
    <div class="hint" style="margin-bottom:14px;">数字を直接入力すると、その順位に移動します。右上の「#」から売上ナンバーをまとめて登録すると、名前が一致する人は写真が上がり次第、自動でその順位になります。▲▼でも1つずつ動かせます。「運営」ボタンでIKEMEN LISTに出さない人を設定できます。名前をタップすると写真を編集できます（出勤中でなくてもOK）。写真が無いまま出勤した人は、その編集画面から一時的にIKEMEN LISTから消せます（写真が付くと自動で戻ります）。</div>
    <div class="reorder-list">${list.map((s,i)=>reorderRowHtml(s, i, list.length)).join('')}</div>
  `;
}
function reorderRowHtml(s, i, total){
  const photo = resolvedGalleryPhotos[s.id];
  const excluded = !!excludedStaff[s.id];
  const hidden = !!galleryHidden[s.id];
  // Surfaces an otherwise-invisible failure mode: this person has a photo
  // and SOME ナンバー表 has been registered, but their name doesn't match
  // any entry in it (even after rankForStaffName's loose matching) — so
  // they'll never get auto-placed until the name is fixed on one side or
  // the other. Shown as a neutral fact in the same slot as 運営/写真待ち,
  // never alongside them (those already explain why this row doesn't need
  // a ナンバー match).
  const noRankMatch = !!photo && Object.keys(nameRankTable||{}).length>0 && !Number.isFinite(rankForStaffName(s.name));
  return `
    <div class="reorder-row${excluded ? ' excluded' : ''}">
      <input class="reorder-rank" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
        value="${i+1}" data-action="setStaffPosition" data-id="${escapeHtml(s.id)}" aria-label="順位">
      <button class="reorder-main" data-action="openStaffDetail" data-id="${escapeHtml(s.id)}" data-return="reorder">
        ${photo
          ? `<img class="reorder-thumb" src="${photo}" alt="">`
          : `<div class="reorder-thumb placeholder" style="background:${colorFor(s.id)}">${escapeHtml((s.name||'?').slice(0,1))}</div>`}
        <div class="reorder-text">
          <div class="reorder-name">${escapeHtml(s.name)}</div>
          ${excluded ? `<div class="reorder-sub">運営（IKEMEN LISTに非表示）</div>` : (hidden ? `<div class="reorder-sub">写真待ちのため非表示中</div>` : (noRankMatch ? `<div class="reorder-sub rank-mismatch">ナンバー表に未登録（名前の表記が違う？）</div>` : ''))}
        </div>
      </button>
      <div class="reorder-btns">
        <div class="reorder-btns-row">
          <button class="btn icon-only ghost" data-action="moveStaffUp" data-id="${escapeHtml(s.id)}" ${i===0 ? 'disabled' : ''}>▲</button>
          <button class="btn icon-only ghost" data-action="moveStaffDown" data-id="${escapeHtml(s.id)}" ${i===total-1 ? 'disabled' : ''}>▼</button>
        </div>
        <button class="btn ghost ops-toggle${excluded ? ' active' : ''}" data-action="toggleOpsStaff" data-id="${escapeHtml(s.id)}">${excluded ? '✓運営' : '運営'}</button>
      </div>
    </div>
  `;
}

function rankImportHtml(){
  const text = rankImportDraft!==null ? rankImportDraft : formatNameRankTable(nameRankTable);
  return `
    <div class="rank-import-intro">
      Excelなどで「名前」と「数字」の2列を選んでコピーし、下の欄にそのまま貼り付けて「保存して反映」を押してください（1行に1人分、名前の後に数字）。<br><br>
      例：<br>たろう　1<br>じろう　2<br>さぶろう　3<br><br>
      名前が一致する人は、宣材写真が登録済みなら保存した瞬間に、まだ写真がない人は写真が上がり次第、自動でその順位に並び替わります。
    </div>
    <textarea id="rankImportTextarea" class="rank-textarea" placeholder="たろう　1&#10;じろう　2&#10;さぶろう　3">${escapeHtml(text)}</textarea>
    <button class="btn gold block" style="margin-top:12px;" data-action="saveRankImport">保存して反映</button>
  `;
}

init();
</script>
</body>
</html>
